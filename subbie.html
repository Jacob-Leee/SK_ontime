<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SK Field App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="theme-color" content="#1C1C1E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#F2F1EC;--card:#fff;--border:#E5E5E0;--text1:#1C1C1E;--text2:#3C3C43;
      --text3:#8A8A8E;--blue:#007AFF;--green:#34C759;--orange:#FF9500;
      --red:#FF3B30;--purple:#5856D6;--yellow:#FFCC00;
    }
    html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--text1);overflow:hidden}

    /* ── LOGIN ── */
    #login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:calc(52px + env(safe-area-inset-top))}
    .login-logo{width:72px;height:72px;border-radius:20px;background:#1C1C1E;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .login-logo img{width:52px;height:52px;object-fit:contain}
    .login-title{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.4px;margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:36px}
    .name-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
    .name-row{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;cursor:pointer;user-select:none;transition:border-color .15s,box-shadow .15s}
    .name-row:active{box-shadow:0 0 0 3px rgba(88,86,214,.18);border-color:var(--purple)}
    .name-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
    .name-label{font-size:16px;font-weight:700;color:var(--text1)}

    /* ── MAIN APP ── */
    #app{display:none;flex-direction:column;height:100%}
    #app.visible{display:flex}

    /* Header */
    #hdr{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:10px;height:calc(56px + env(safe-area-inset-top));flex-shrink:0}
    #hdr-name{font-size:16px;font-weight:800;color:var(--text1);flex:1}
    #hdr-badge{background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
    .hdr-btn{width:36px;height:36px;border-radius:10px;border:none;background:rgba(60,60,67,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}

    /* Tab bar */
    #tabs{background:var(--card);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:none;background:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;font-family:inherit}
    .tab i{font-size:22px}
    .tab-n{position:absolute;top:2px;right:50%;margin-right:-24px;background:var(--purple);color:#fff;
      font-size:9px;font-weight:800;min-width:15px;padding:1px 4px;border-radius:9px;line-height:1.4}
    .tab-n:empty{display:none}
    .tab{position:relative}
    .tab.active{color:var(--purple)}

    /* Content */
    #content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}

    /* Order cards */
    .order-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:transform .1s}
    .order-card:active{transform:scale(0.98)}
    .order-num{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.3px;margin-bottom:4px}
    .order-addr{font-size:15px;font-weight:700;color:var(--text1);margin-bottom:4px;line-height:1.3}
    .order-meta{font-size:12px;color:var(--text3)}
    .oc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .oc-badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
    .oc-copy{margin-left:auto;background:none;border:none;padding:2px 6px;font-size:17px;line-height:1;
      color:var(--text3);cursor:pointer;flex-shrink:0}
    .oc-copy:active{color:var(--purple)}
    .oc-comment{font-size:11.5px;color:var(--text3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .oc-acts{margin-top:8px;display:flex;gap:6px}
    .oc-btn{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer}
    .oc-done{border:1px solid #86EFAC;background:#DCFCE7;color:#15803D}
    .oc-iss{border:1px solid #FCD34D;background:#FEF3C7;color:#B45309}
    .oc-chip{margin-top:8px;display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700}
    .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* Status colours */
    .s-active{background:var(--blue)}
    .s-completed{background:var(--green)}
    .s-invoiced{background:var(--orange)}
    .s-paid{background:#AF52DE}
    .s-cancelled{background:var(--red)}
    .s-issue{background:var(--orange)}
    .s-claim{background:#AF52DE}
    .s-closed{background:var(--text3)}
    .issue-flag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,149,0,.14);
      color:var(--orange);font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}

    /* Empty state */
    .empty{text-align:center;padding:60px 24px;color:var(--text3)}
    .empty i{font-size:48px;margin-bottom:12px;display:block}
    .empty p{font-size:15px;font-weight:600}
    .empty small{font-size:13px}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.45);display:none;align-items:flex-end}
    .modal-overlay.open{display:flex}
    .modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
    .modal-handle{width:36px;height:4px;border-radius:2px;background:rgba(60,60,67,.25);margin:10px auto}
    .modal-hdr{padding:0 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-close{background:rgba(60,60,67,.08);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2)}
    .modal-body{padding:16px}

    /* Issue upload */
    .issue-section{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
    .issue-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text2);display:flex;align-items:center;gap:6px}
    .upload-btn{width:100%;padding:13px;background:var(--bg);border:1.5px dashed var(--border);border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
    .upload-btn:active{background:#E8E8E0}
    .issue-note{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text1);resize:none;margin-top:8px}
    .issue-note:focus{outline:none;border-color:var(--purple)}
    .submit-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
    .submit-btn:active{opacity:.85}
    .submit-btn:disabled{background:var(--text3);cursor:not-allowed}
    #photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
    #photo-grid:empty{display:none}
    .ph-cell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--bg)}
    .ph-cell img{width:100%;height:100%;object-fit:cover;display:block}
    .ph-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;
      background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;
      align-items:center;justify-content:center;padding:0}
    .upload-btn:disabled{opacity:.45;cursor:not-allowed}
    .photo-preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
    .issue-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .issue-item{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px}
    .issue-item img{width:100%;border-radius:8px;margin-top:6px}

    /* Detail fields — label/value rows, same shape as the office app so a
       subbie reading a job over the phone is looking at the same layout. */
    .dm-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
    .dm-row:last-child{border-bottom:none}
    .dm-k{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;width:96px;flex-shrink:0;padding-top:2px}
    .dm-v{font-size:14px;color:var(--text1);flex:1;min-width:0;line-height:1.45;word-break:break-word}
    .dm-v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
    .dm-block{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px}
    .dm-block-t{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .dm-block-b{font-size:14px;color:var(--text1);white-space:pre-wrap;line-height:1.55}

    /* ── SETTINGS SHEET ── */
    .set-group{margin-bottom:18px}
    .set-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;padding:0 4px 8px}
    .set-card{background:var(--bg);border-radius:14px;overflow:hidden}
    .set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
    .set-row:last-child{border-bottom:none}
    .set-row:active{background:#E8E8E0}
    .set-row.static{cursor:default}
    .set-row.static:active{background:none}
    .set-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .set-txt{flex:1;min-width:0}
    .set-t{font-size:15px;font-weight:600;color:var(--text1)}
    .set-d{font-size:12px;color:var(--text3);margin-top:1px}
    .set-val{font-size:13px;font-weight:700;flex-shrink:0}
    .set-chev{color:var(--text3);font-size:16px;flex-shrink:0}

    /* Toast */
    #toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
    #toast.show{opacity:1}

    /* FCM banner */
    #fcm-bar{display:none;position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:9998;background:#1C1C1E;border-radius:14px;padding:12px 14px;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
    #fcm-bar span{flex:1;font-size:13px;color:#fff;font-weight:600}
    #fcm-bar button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}

    @keyframes fcmSlideIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    #fcm-notif-banner{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;border-radius:14px;padding:12px 16px;z-index:99999;max-width:calc(100vw - 32px);width:340px;box-shadow:0 4px 20px rgba(0,0,0,.25);display:none;gap:10px;align-items:flex-start;animation:fcmSlideIn .3s ease}
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen">
  <div class="login-logo">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231C1C1E'/%3E%3Ctext x='24' y='34' text-anchor='middle' font-size='26' font-weight='900' fill='white' font-family='Arial'%3ESK%3C/text%3E%3C/svg%3E" alt="SK">
  </div>
  <div class="login-title">SK Field App</div>
  <div class="login-sub" id="sb-login-sub">Sign in with your Google account</div>

  <button id="sb-google-btn" onclick="sbGoogleSignIn()"
    style="width:100%;max-width:320px;display:flex;align-items:center;justify-content:center;gap:11px;padding:15px 18px;border-radius:13px;border:1px solid #D1D1D6;background:#fff;color:#3c4043;font-size:15px;font-weight:600;margin:8px auto 0;font-family:inherit">
    <svg width="19" height="19" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google로 로그인
  </button>

  <div id="sb-fallback" style="display:none;width:100%;max-width:320px;margin:18px auto 0;text-align:left"></div>
  <div id="sb-login-err" style="display:none;max-width:320px;margin:16px auto 0;padding:12px 14px;border-radius:10px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.25);color:#C0392B;font-size:12.5px;line-height:1.6;text-align:left;white-space:pre-line"></div>
  <div style="margin-top:28px;font-size:10px;color:var(--text3)">build <span id="sb-build"></span></div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <div id="hdr">
    <div id="hdr-name">My Orders</div>
    <span id="hdr-badge" style="display:none">0</span>
    <button class="hdr-btn" onclick="sbOpenSettings()" title="Settings">
      <i class="ti ti-menu-2" style="font-size:19px"></i>
    </button>
  </div>

  <div id="content">
    <div id="order-list"></div>
  </div>

  <div id="tabs">
    <button class="tab" id="tab-notices" onclick="sbTab('notices')">
      <i class="ti ti-speakerphone"></i>Notices<span class="tab-n" id="tn-notices"></span>
    </button>
    <button class="tab active" id="tab-orders" onclick="sbTab('orders')">
      <i class="ti ti-bolt"></i>Active<span class="tab-n" id="tn-orders"></span>
    </button>
    <button class="tab" id="tab-issue" onclick="sbTab('issue')">
      <i class="ti ti-alert-triangle"></i>Issue<span class="tab-n" id="tn-issue"></span>
    </button>
    <button class="tab" id="tab-completed" onclick="sbTab('completed')">
      <i class="ti ti-circle-check"></i>Completed<span class="tab-n" id="tn-completed"></span>
    </button>
    <button class="tab" id="tab-claim" onclick="sbTab('claim')">
      <i class="ti ti-receipt"></i>Claim<span class="tab-n" id="tn-claim"></span>
    </button>
    <button class="tab" id="tab-closed" onclick="sbTab('closed')">
      <i class="ti ti-lock"></i>Closed<span class="tab-n" id="tn-closed"></span>
    </button>
  </div>
</div>

<!-- ── ORDER DETAIL MODAL ── -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <div>
        <div id="dm-num" style="font-size:11px;font-weight:700;color:var(--text3)"></div>
        <div id="dm-title" style="font-size:17px;font-weight:800;margin-top:2px"></div>
      </div>
      <button id="dm-copy" onclick="sbCopyOrder(_currentOrder && _currentOrder.id)"
        style="background:var(--bg);border:none;border-radius:8px;padding:6px 11px;font-size:12.5px;
        font-weight:600;color:var(--text2);cursor:pointer;margin-right:8px;font-family:inherit">&#9112; Copy</button>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div id="dm-status" style="margin-bottom:14px"></div>
      <div id="dm-fields"></div>

      <!-- Mark work finished. Same queue as an issue report, opposite outcome:
           the office sees it land in Completed instead of Issues. -->
      <div id="dm-done-wrap" style="margin-top:14px;display:none">
        <button class="submit-btn" id="done-btn" style="background:var(--green)" onclick="sbReportDone()">
          <i class="ti ti-circle-check"></i> Report work done
        </button>
        <div style="font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5">
          Sends this to the office Completed list for review.
        </div>
      </div>

      <!-- Issue upload section -->
      <div class="issue-section">
        <div class="issue-title">
          <i class="ti ti-camera" style="color:var(--orange)"></i>
          Report an Issue
        </div>
        <button class="upload-btn" id="add-photo-btn" onclick="sbPickPhoto()">
          <i class="ti ti-photo-plus"></i> Add photo <span id="photo-count" style="opacity:.6"></span>
        </button>
        <div id="photo-grid"></div>
        <textarea id="issue-note" class="issue-note" rows="3" placeholder="Describe the issue (optional)..."></textarea>
        <button class="submit-btn" id="submit-btn" onclick="sbSubmitIssue()">Submit issue</button>
        <div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5">
          Submitting sends this to the office Issues list for review.
        </div>
      </div>

      <!-- Past issues -->
      <div id="past-issues" class="issue-list"></div>
    </div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="sbPhotoChosen(this)">

<!-- FCM enable bar -->
<div id="fcm-bar">
  <i class="ti ti-bell" style="font-size:20px;color:#fff;flex-shrink:0"></i>
  <span>Enable push notifications to get new job alerts</span>
  <button onclick="sbFcmEnable()">Enable</button>
</div>

<!-- FCM foreground banner -->
<div id="fcm-notif-banner"></div>

<!-- Settings sheet -->
<div class="modal-overlay" id="set-overlay" onclick="if(event.target===this)sbCloseSettings()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <div style="font-size:17px;font-weight:800">Settings</div>
      <button class="modal-close" onclick="sbCloseSettings()">&times;</button>
    </div>
    <div class="modal-body" id="set-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ============================================================
// PHOTO STAMP
// ------------------------------------------------------------
// Burns the job details into the top-right of a site photo: date and time,
// order number, address, PRN. Homes NSW evidence has to be self-identifying —
// a photo in a folder six months later is worthless if nobody can say which
// property or which job it belongs to, and file metadata does not survive
// being emailed or re-saved.
//
// Drawn on a canvas, so the text is part of the image itself.
// ============================================================

function _stampText(order) {
  const d = new Date();
  const date = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'numeric', year: 'numeric' });
  const time = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true })
                .toLowerCase().replace(/\s/g, ' ');
  const lines = [date + ', ' + time];
  const head = [(order && order.orderNumber) || '', (order && order.address) || '']
                 .filter(Boolean).join('   ');
  if (head) lines.push(head);
  if (order && order.prn) lines.push(String(order.prn));
  return lines;
}

// Wrap on width, keeping the order number on the first line where possible.
function _stampWrap(ctx, lines, maxW) {
  const out = [];
  lines.forEach(line => {
    if (ctx.measureText(line).width <= maxW) { out.push(line); return; }
    let cur = '';
    line.split(' ').forEach(word => {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width <= maxW) { cur = test; }
      else { if (cur) out.push(cur); cur = word; }
    });
    if (cur) out.push(cur);
  });
  return out;
}

// 1100px at q0.55 lands around 120-180 KB — roughly a quarter of what 1600/0.82
// produced, and still far more than enough to show a cracked tile, a leak or a
// wrong fitting. The stamp scales with the image width, so it stays legible.
// Site reception is the bottleneck here, not the camera.
function stampPhoto(file, order, maxDim = 1100, quality = 0.55) {
  return new Promise(resolve => {
    if (!/^image\//.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const W = Math.round(img.width * scale), H = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);

        // Scale with the image so it reads the same on any phone.
        const fs  = Math.max(13, Math.round(W / 26));
        const pad = Math.round(W * 0.025);
        ctx.font = '700 ' + fs + 'px -apple-system, "Helvetica Neue", Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';

        const lines = _stampWrap(ctx, _stampText(order), W - pad * 2);
        const lh = Math.round(fs * 1.22);

        // Outline behind the fill: site photos are unpredictable — white text
        // vanishes on a rendered wall, black vanishes in a shadow.
        ctx.lineWidth = Math.max(2, Math.round(fs / 6));
        ctx.strokeStyle = 'rgba(0,0,0,0.72)';
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;
        ctx.fillStyle = '#FFFFFF';

        let y = pad;
        lines.forEach(t => {
          ctx.strokeText(t, W - pad, y);
          ctx.fillText(t, W - pad, y);
          y += lh;
        });

        c.toBlob(b => resolve(b
          ? new File([b], (file.name || 'photo').replace(/\.\w+$/, '') + '_stamped.jpg', { type: 'image/jpeg' })
          : file), 'image/jpeg', quality);
      } catch (e) {
        console.warn('[STAMP] failed, using original:', e);
        resolve(file);
      }
    };
    // HEIC or anything the browser cannot decode goes up unstamped rather than
    // failing the whole submission.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}


// Ctrl+Shift+R has no equivalent on a phone, and an installed PWA will happily
// serve a stale cached build for days. This clears the caches and reloads with
// a fresh query string. It does NOT touch localStorage — that is the data — and
// it updates the service worker rather than unregistering it, which would kill
// push notifications.
async function hardReload() {
  if (!confirm('Reload the app from scratch?\n\nFetches the latest build.\nYour saved data is not affected.')) return;
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.update().catch(() => {})));
    }
  } catch (e) { console.warn('[RELOAD] cache clear failed:', e); }
  const base = location.origin + location.pathname;
  location.replace(base + '?v=' + Date.now());
}

// Must match _subbieKey() in index.html / mobile.html exactly — if the two
// drift, orders stop matching and the app looks empty rather than broken.
function _subbieKey(name) {
  return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
let _mirrorSize = 0;

// Called only when a subbie's own query comes back empty. Distinguishes "the
// office has not sent anything yet" from "your name does not match what the
// office typed" — cheap, because it asks for a single record, not the node.
let _ordersQuery = null;
let _sbMode = 'indexed';   // 'indexed' | 'scan'

// Two ways of reading the mirror, and the app moves between them on its own.
//
//  indexed — orderByChild('subbieKey'), so the phone downloads only this
//            subbie's orders. Requires records written by a recent build.
//  scan    — read the whole node and filter here. Slower, but works against
//            records mirrored before subbieKey existed.
//
// Starting indexed and falling back on an empty result means a subbie is never
// left staring at a blank app waiting for the office to run something.
function sbLoadOrders() {
  if (!_db || !_user) return;
  sbDetachOrders();
  _sbMode = 'indexed';
  _ordersQuery = _db.ref('/orders').orderByChild('subbieKey').equalTo(_subbieKey(_user));
  _ordersListener = _ordersQuery.on('value', snap => _sbApplyOrders(snap, true));
}

function sbDetachOrders() {
  if (_ordersListener) {
    try { (_ordersQuery || _db.ref('/orders')).off('value', _ordersListener); } catch (e) {}
  }
  _ordersListener = null;
  _ordersQuery = null;
}

function _sbApplyOrders(snap, fromIndexed) {
  const data = snap.val() || {};
  const me   = _subbieKey(_user);

  // Compare on the normalised name either way: 'KH LEE' and 'KH Lee' are the
  // same person, and a trailing space typed into the order form should not
  // hide someone's work from them.
  _allOrders = Object.values(data).filter(o => o && _subbieKey(o.subbies) === me);

  // An empty indexed result is not proof of "no orders" — it is equally
  // consistent with old records that have no subbieKey. Switch to scanning
  // once, permanently, rather than re-deciding on every update. The earlier
  // version re-ran a one-shot scan from inside the indexed listener, so the
  // second time anything changed it cleared the list it had just recovered.
  if (!_allOrders.length && fromIndexed && _sbMode === 'indexed') {
    _sbMode = 'scan';
    console.log('[SB] indexed query empty — switching to full scan');
    sbDetachOrders();
    _ordersQuery = _db.ref('/orders');
    _ordersListener = _ordersQuery.on('value', s2 => _sbApplyOrders(s2, false));
    return;
  }

  _mirrorSize = _allOrders.length ? _allOrders.length
              : (Object.keys(data).length ? -1 : 0);   // -1 = data exists, none mine

  sbRender();

  const active = _allOrders.filter(o => (o.status || 'active') === 'active').length;
  const badge = document.getElementById('hdr-badge');
  if (badge) {
    if (active > 0) { badge.textContent = active; badge.style.display = ''; }
    else { badge.style.display = 'none'; }
  }
}

let _sbReports = {};       // orderId -> reports the office has not cleared
let _sbLatest  = {};       // orderId -> newest report, reviewed or not
let _sbReportsRef = null, _sbReportsCb = null;
function sbWatchReports() {
  if (!_db) return;
  // sbLogin() runs again on every auth state change — a token refresh is enough
  // — and without this each pass attached another /issues listener. Every one
  // of them fires on every report, so the work and the memory grow with the
  // length of the session.
  if (_sbReportsRef && _sbReportsCb) {
    try { _sbReportsRef.off('value', _sbReportsCb); } catch (e) {}
  }
  _sbReportsRef = _db.ref('/issues');
  _sbReportsCb = _sbReportsRef.on('value', snap => {
    const byOrder = snap.val() || {};
    const map = {}, latest = {};
    Object.keys(byOrder).forEach(oid => {
      Object.keys(byOrder[oid] || {}).forEach(ts => {
        const r = byOrder[oid][ts] || {};
        if (r.type !== 'issue' && r.type !== 'done') return;
        const at = Number(ts) || r.at || 0;
        // Track the newest report either way. A reviewed one is an outcome, not
        // an absence — without this the card reset to [Complete] [Issue] the
        // moment the office cleared it, which reads as "my report was lost".
        if (!latest[oid] || at > (latest[oid]._at || 0)) latest[oid] = Object.assign({ _at: at }, r);
        if (r.reviewedAt) return;
        (map[oid] = map[oid] || []).push(r);
      });
    });
    _sbReports = map;
    _sbLatest = latest;
    sbRender();
  });
}
function sbPendingFor(id) { return _sbReports[id] || []; }

// Only on jobs still to do. A closed order has nothing left to report.
// Copies the order in the shape people paste into a text or an email:
//   SCO-02641963 - 11_8-14 GROVE ST, GUILDFORD, NSW 2161 - PRN 237591
// Same format the office app uses, so both sides quote a job identically.
function sbCopyOrder(id) {
  const o = (_allOrders || []).find(x => x.id === id) || _currentOrder;
  if (!o) return;
  const text = [
    o.orderNumber || '',
    o.address || '',
    o.prn ? 'PRN ' + o.prn : ''
  ].filter(Boolean).join(' - ');

  const done = () => {
    sbShowToast('Copied');
    const b = document.getElementById('cp-' + id);
    if (b) { const old = b.innerHTML; b.innerHTML = '&#10003;'; setTimeout(() => { b.innerHTML = old; }, 1200); }
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => sbCopyFallback(text, done));
  } else {
    sbCopyFallback(text, done);
  }
}

// Older iOS Safari refuses the clipboard API outside a few narrow cases, and a
// copy button that silently does nothing is worse than none at all.
function sbCopyFallback(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) return done();
  } catch (e) {}
  prompt('Copy this:', text);
}

// ── Order documents, read-only on a phone ─────────────────────
// Uploading a 100 MB scope from a phone is not the job; knowing whether one
// arrived, and being able to open it on site, is.
let _pDocs = {}, _pDocsWatch = false;

function _pDocsDb() { return _sharedDb(); }

let _pDocsWatchTries = 0;
function watchOrderDocs(onChange) {
  if (_pDocsWatch) return;
  const db = _pDocsDb();
  if (!db) {
    if (_pDocsWatchTries++ < 20) setTimeout(() => watchOrderDocs(onChange), 500);
    return;
  }
  _pDocsWatch = true;
  db.ref('/docs').on('value', snap => {
    _pDocs = snap.val() || {};
    if (onChange) { try { onChange(); } catch (e) {} }
  });
}

function docsFor(orderId) {
  const m = _pDocs[orderId] || {};
  return Object.keys(m).map(k => Object.assign({ _key: k }, m[k]))
    .sort((a, b) => (b.at || 0) - (a.at || 0));
}

function _docNameKey(n) {
  return String(n || 'unknown').replace(/[.#$[\]/]/g, '_').slice(0, 60);
}

function _pDocSize(b) {
  if (!b) return '';
  return b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
}

function _pDocIcon(name) {
  const e = (String(name || '').split('.').pop() || '').toLowerCase();
  if (e === 'pdf') return '\u{1F4C4}';
  if (['xls','xlsx','xlsm','csv'].includes(e)) return '\u{1F4CA}';
  if (['doc','docx'].includes(e)) return '\u{1F4DD}';
  if (['jpg','jpeg','png','heic','webp','gif'].includes(e)) return '\u{1F5BC}';
  return '\u{1F4CE}';
}

// Records who opened it, so the office can see the document landed.
function docOpen(orderId, key, url, who) {
  const db = _pDocsDb();
  if (db) {
    db.ref('/docs/' + orderId + '/' + key + '/readBy/' + _docNameKey(who))
      .set({ name: who, at: Date.now() })
      .catch(e => console.warn('[DOC] read mark failed:', e.message));
  }
  window.open(url, '_blank', 'noopener');
}

// "NEW" means new to ME. With a global flag, one person's download cleared the
// badge for everybody — including people who had never opened the file.
function _docMeName() {
  return (typeof _user !== 'undefined' && _user) || window._SUBBIE_NAME || 'Subcontractor';
}
function _docSeenByMe(f) {
  if (!f) return false;
  // You cannot receive your own upload. Marking the uploader's file as NEW made
  // the badge meaningless for whoever does most of the uploading — KH LEE saw
  // four NEW files that were all his own.
  const me = _docNameKey(_docMeName());
  if (f.by && _docNameKey(f.by) === me) return true;
  // Once anyone has picked it up the file has landed, so it stops being NEW for
  // everyone. Per-person tracking was more precise but left NEW sitting on
  // files the team had already dealt with, which trains people to ignore it.
  // Who actually took it is still recorded and shown in the ✓ label.
  return Object.keys(f.readBy || {}).length > 0;
}

// Small badge for an order card: how many files, how many still untouched.
function docBadge(orderId) {
  const fs = docsFor(orderId);
  if (!fs.length) return '';
  const unread = fs.filter(f => !_docSeenByMe(f)).length;
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
    background:${unread ? '#FEF3C7' : 'rgba(0,0,0,.05)'};color:${unread ? '#B45309' : 'var(--text3)'};
    border-radius:20px;padding:2px 8px">\u{1F4CE} ${fs.length}${unread ? ' · ' + unread + ' new' : ''}</span>`;
}

// Full list for an order detail view.
function docListHtml(orderId, who) {
  const fs = docsFor(orderId);
  if (!fs.length) return '';
  return `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
    <div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Documents</div>
    ${fs.map(f => {
      const read = Object.values(f.readBy || {}).map(r => r && r.name).filter(Boolean);
      return `<div onclick="docOpen('${orderId}','${esc(f._key)}','${esc(f.url)}','${esc(who)}')"
        style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer">
        <span style="font-size:17px;flex-shrink:0">${_pDocIcon(f.name)}</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:13px;color:var(--text1,var(--text));overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name || '')}</span>
          <span style="display:block;font-size:11px;color:var(--text3);margin-top:1px">${_pDocSize(f.size)} · ${esc(f.by || '')}${
            f.at ? ' · ' + new Date(f.at).toLocaleDateString('en-AU', { day: '2-digit', month: 'short' }) : ''}</span>
        </span>
        ${_docSeenByMe(f)
          ? `<span title="Opened by ${esc(read.join(', '))}" style="font-size:10px;font-weight:700;color:#15803D;background:#DCFCE7;border-radius:20px;padding:2px 7px;flex-shrink:0">&#10003;</span>`
          : `<span style="font-size:10px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:20px;padding:2px 7px;flex-shrink:0">NEW</span>`}
        <span style="color:var(--text3);font-size:15px;flex-shrink:0">&#8595;</span>
      </div>`;
    }).join('')}
  </div>`;
}

// ── Area notices ───────────────────────────────────────────────
// Shared standing information about a patch: access quirks, a council rule,
// a Homes NSW contact change. It lives against the AREA rather than an order
// because it applies to every job there, and repeating it per order is how it
// ends up out of date in half of them.
let _notices = {}, _noticeWatch = false;

// Resolve the database the same way the rest of this file does.
//
// This used to look only for _rtdbDB / _rtdbDb — names that belong to the
// desktop app. In subbie.html the handle is _db and in mobile it is set up
// late, so this returned null every time and the watcher never attached.
// Notices and documents were silently dead here, not broken: never started.
function _sharedDb() {
  try {
    if (typeof _db !== 'undefined' && _db) return _db;
  } catch (e) {}
  try {
    if (typeof _rtdbDB !== 'undefined' && _rtdbDB) return _rtdbDB;
  } catch (e) {}
  try {
    if (typeof _rtdbInit === 'function') {
      _rtdbInit();
      if (typeof _rtdbDB !== 'undefined' && _rtdbDB) return _rtdbDB;
    }
  } catch (e) {}
  try {
    if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) {
      return firebase.database(firebase.apps[0]);
    }
  } catch (e) {}
  return null;
}

function _noticeDb() { return _sharedDb(); }

let _noticeWatchTries = 0;
function watchNotices(onChange) {
  if (_noticeWatch) return;
  const db = _noticeDb();
  if (!db) {
    if (_noticeWatchTries++ < 20) setTimeout(() => watchNotices(onChange), 500);
    return;
  }
  _noticeWatch = true;
  db.ref('/notices').on('value', snap => {
    _notices = snap.val() || {};
    if (onChange) { try { onChange(); } catch (e) {} }
  });
}

// Highlighting is mechanical, not clever: it marks the things people actually
// scan a notice for. Anything it cannot recognise is left exactly as typed —
// a guess that highlights the wrong clause is worse than no highlight.
//
// Runs on the ALREADY-ESCAPED string, so it can never introduce markup from
// user input; the only tags added are the ones written here.
function noticeHighlight(escaped) {
  let t = String(escaped == null ? '' : escaped);

  // Colour AND bold. Colour says what kind of thing it is; bold makes it carry
  // at arm's length on a phone in daylight.
  //
  // Runs on the ALREADY-ESCAPED string, so it can never introduce markup from
  // user input — the only tags added are the ones written here.

  // SoR codes. The rule, exactly:
  //   a letter, then 1-3 more letters/digits,
  //   then 1-3 groups of 2-4 letters/digits after hyphens,
  //   then a final hyphen and 1-4 digits.
  // Letters-and-digits mid-code is deliberate (BAS-WM3-RPL-113), and a single
  // trailing digit counts (LLH-DLL-SER-3) — requiring two skipped half the
  // reference table while highlighting the codes right beside them.
  t = t.replace(/\b([A-Z][A-Z0-9]{1,3}(?:-[A-Z0-9]{2,4}){1,3}-\d{1,4})\b/g,
    '<b style="font-family:ui-monospace,Menlo,monospace;font-size:.94em;font-weight:800;color:#7C4A03;' +
    'background:#FEF3C7;border:1px solid #FDE68A;border-radius:5px;padding:0 4px">$1</b>');

  // Words that decide whether a job is compliant.
  t = t.replace(/\b(Mandatory|MANDATORY|mandatory|Prohibited|PROHIBITED|prohibited|Do not|DO NOT|do not|Must not|must not|Never|never)\b/g,
    '<b style="color:#B91C1C">$1</b>');

  // Measurements and thresholds. esc() has already turned > into &gt;.
  t = t.replace(/(&gt;\s*\d+\s*%|\b\d+(?:\/\d+)*\s?mm\b|\b\d+\s?m\b(?!m)|\b\d+\s?%)/g,
    '<b style="color:#1D4ED8">$1</b>');

  // Area codes, so an exception for one patch is visible at a glance.
  t = t.replace(/\b(CA\d{1,2})\b/g,
    '<b style="color:#4338CA">$1</b>');

  return t;
}

// A notice is a reference sheet, not a paragraph. Rendered as one pre-wrap
// block it was a wall of identical lines — the section numbers, the list items
// and the code table all looked the same, so nothing could be found by eye.
//
// This reads the structure people already type rather than asking them to
// learn a syntax:
//
//   first line            → title
//   "1. Something"        → numbered section, with a rule above it
//   "Something:"          → sub-heading
//   "- x" / "• x"         → bullet
//   plain line inside a
//   numbered section      → bullet (that is what those lines are)
//   "left    right"       → two-column row, which is how code tables are typed
//   blank line            → real spacing
//
// Every line is escaped first and then passed through noticeHighlight, so the
// only markup that can appear is the markup written here.
function noticeFormat(raw) {
  const lines = String(raw == null ? '' : raw).replace(/\r/g, '').split('\n');
  const H = t => noticeHighlight(esc(t));
  const out = [];
  let inSection = false, started = false;

  const P = 'margin:0;font-size:13.5px;line-height:1.65;color:var(--text,#1C1C1E)';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();

    // Blank lines before the title are just stray newlines from a paste, and a
    // spacer for them would open the notice with a gap.
    if (!t) { if (started) { inSection = false; out.push('<div style="height:9px"></div>'); } continue; }

    // Numbered section — checked BEFORE the title rule.
    //
    // A notice that opens straight into "1. Mandatory Site Comments" had its
    // first line swallowed as a title: section 1 lost its badge while every
    // other section kept one, and the lines under it never became bullets
    // because the section was never opened.
    const sec = /^(\d+)[.)]\s+(.*)$/.exec(t);

    // Title — the first line, but only when it is not already a section.
    if (!started && !sec) {
      started = true;
      out.push('<div style="font-size:15px;font-weight:800;letter-spacing:-.2px;margin:0 0 8px;color:var(--text,#1C1C1E)">' + H(t) + '</div>');
      continue;
    }

    if (sec) {
      started = true;
      inSection = true;
      out.push('<div style="display:flex;gap:8px;align-items:baseline;margin:13px 0 6px;padding-top:9px;border-top:1px solid #E0E7FF">' +
        '<span style="flex-shrink:0;min-width:20px;height:20px;border-radius:6px;background:#4338CA;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">' + esc(sec[1]) + '</span>' +
        '<span style="font-size:14px;font-weight:800;color:#3730A3">' + H(sec[2]) + '</span></div>');
      continue;
    }

    // Explicit bullet.
    const bul = /^[-•*·]\s+(.*)$/.exec(t);
    if (bul) { out.push(_noticeBullet(H(bul[1]), P)); continue; }

    // Two-column row: "No painting required     CCF-PAT-REP-132".
    // Requires a real gap (tab or 2+ spaces) so ordinary sentences are untouched.
    const col = /^(.*?\S)(?:\t+|\s{2,})(\S.*)$/.exec(line.replace(/\s+$/, ''));
    if (col && col[1].length <= 42) {
      out.push('<div style="display:flex;gap:10px;padding:3px 0;font-size:13px;line-height:1.55">' +
        '<span style="flex:0 0 46%;color:var(--text2,#3C3C43)">' + H(col[1]) + '</span>' +
        '<span style="flex:1;min-width:0">' + H(col[2]) + '</span></div>');
      continue;
    }

    // Sub-heading — a short line ending in a colon.
    if (/:$/.test(t) && t.length <= 60) {
      out.push('<div style="font-size:13px;font-weight:800;color:var(--text,#1C1C1E);margin:10px 0 4px">' + H(t) + '</div>');
      continue;
    }

    // Inside a numbered section, plain lines are the list.
    if (inSection) { out.push(_noticeBullet(H(t), P)); continue; }

    out.push('<p style="' + P + ';margin:3px 0">' + H(t) + '</p>');
  }
  return started ? out.join('') : '';
}

function _noticeBullet(html, P) {
  return '<div style="display:flex;gap:8px;padding:2px 0 2px 2px">' +
    '<span style="flex-shrink:0;color:#818CF8;font-size:13px;line-height:1.65">&bull;</span>' +
    '<span style="' + P + '">' + html + '</span></div>';
}

function noticesFor(area) {
  const a = (area || '').trim();
  if (!a) return [];
  const m = _notices[a] || {};
  return Object.keys(m).map(k => Object.assign({ _key: k }, m[k]))
    .filter(n => n && n.text)
    .sort((a2, b2) => (b2.at || 0) - (a2.at || 0));
}

function noticeChip(area) {
  const n = noticesFor(area);
  if (!n.length) return '';
  return `<span title="${esc(n[0].text)}" style="display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;background:#EEF2FF;color:#4338CA;border-radius:20px;padding:2px 8px">
    &#128227; ${esc(area)}${n.length > 1 ? ' ' + n.length : ''}</span>`;
}

function noticeBlock(areas) {
  const list = [];
  [...new Set((areas || []).filter(Boolean))].forEach(a =>
    noticesFor(a).forEach(n => list.push(Object.assign({ area: a }, n))));
  if (!list.length) return '';
  list.sort((a, b) => (b.at || 0) - (a.at || 0));
  return `<div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:12px;padding:11px 13px;margin-bottom:10px">
    <div style="font-size:11px;font-weight:800;color:#4338CA;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">&#128227; Area notices</div>
    ${list.slice(0, 8).map(n => `<div style="display:flex;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.5">
      <span style="flex-shrink:0;font-weight:800;color:#4338CA;min-width:34px">${esc(n.area)}</span>
      <span style="flex:1;min-width:0;color:var(--text2,#3C3C43);white-space:pre-wrap">${esc(n.text)}</span>
      <span style="flex-shrink:0;font-size:10.5px;color:var(--text3)">${esc(n.by || '')}</span>
    </div>`).join('')}
  </div>`;
}

function sbCardActions(o) {
  if ((o.status || 'active') !== 'active') return '';
  const pending = sbPendingFor(o.id);
  if (pending.length) {
    const isIssue = pending.some(r => r.type === 'issue');
    return '<div class="oc-chip" style="background:' + (isIssue ? '#FEF3C7' : '#DCFCE7') +
      ';color:' + (isIssue ? '#B45309' : '#15803D') + '">' +
      (isIssue ? '&#9888; Issue sent' : '&#10003; Done sent') + '</div>';
  }

  // Cleared by the office. That is the outcome — showing the two buttons again
  // would read as "nothing was ever sent" and invite a duplicate report.
  const last = _sbLatest[o.id];
  if (last && last.reviewedAt) {
    return '<div class="oc-chip" style="background:#E7EEFB;color:#1D4ED8">&#10003; Office confirmed' +
      (last.type === 'issue' ? ' &middot; issue' : '') + '</div>';
  }
  return '<div class="oc-acts" onclick="event.stopPropagation()">' +
    '<button class="oc-btn oc-done" onclick="sbQuickDone(\'' + o.id + '\')">&#10003; Complete</button>' +
    '<button class="oc-btn oc-iss" onclick="sbQuickIssue(\'' + o.id + '\')">&#9888; Issue</button>' +
  '</div>';
}

// Straight through, no dialog — the same one tap the office app gives.
async function sbQuickDone(id) {
  const o = _allOrders.find(x => x.id === id);
  if (!o) return;
  if (!confirm((o.orderNumber || '') + '\n' + (o.address || '') + '\n\nReport this job as finished?')) return;
  _currentOrder = o;
  try {
    await _sbWriteReport('done', '', []);
    sbShowToast('Reported as done ✓');
  } catch (e) { _sbReportError(e); }
}

// Opens the order so the photo and note fields are right there.
function sbQuickIssue(id) {
  sbOpenOrder(id);
  setTimeout(() => {
    const el = document.getElementById('issue-note');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 220);
}

function sbRender() {
  const list = document.getElementById('order-list');
  let orders;
  const byNewest = (a, b) => (b.completedAt || b.updatedAt || 0) - (a.completedAt || a.updatedAt || 0);

  // One tab per office status, in the same order and under the same names as
  // the sidebar the office looks at. A subbie asking "where is my job up to?"
  // and the coordinator answering are now looking at the same word.
  const BUCKETS = {
    orders:    o => !['completed','invoiced','paid','cancelled','closed','claim','issue'].includes(o.status || 'active'),
    issue:     o => (o.status || '') === 'issue',
    completed: o => (o.status || '') === 'completed',
    claim:     o => ['claim','invoiced','paid'].includes(o.status || ''),
    closed:    o => (o.status || '') === 'closed',
  };
  // Notices are not orders, so they get their own branch rather than a bucket
  // that would have to pretend an announcement is a job.
  if (_activeTab === 'notices') {
    sbCountNotices();
    list.innerHTML = sbNoticesPage();
    return;
  }

  orders = _allOrders.filter(BUCKETS[_activeTab] || BUCKETS.orders).sort(byNewest);

  // Counts on every tab, so an empty screen is obviously empty rather than
  // possibly broken — the subbie can see at a glance where their work sits.
  Object.keys(BUCKETS).forEach(k => {
    const el = document.getElementById('tn-' + k);
    if (!el) return;
    const n = _allOrders.filter(BUCKETS[k]).length;
    el.textContent = n || '';
  });
  sbCountNotices();

  if (!orders.length) {
    // "Nothing here" has three very different causes and they used to look
    // identical. Say which one it is, so the subbie knows whether to wait, to
    // ring the office, or that there is simply nothing on today.
    let why;
    if (_mirrorSize === 0) {
      why = '<p>Could not load orders</p>' +
            '<small style="margin-top:6px;display:block;line-height:1.6">' +
            'The office has not sent any data yet.<br>Please contact the office.</small>';
    } else if (!_allOrders.length) {
      why = '<p>' + esc(_user || '') + ' has no orders assigned</p>' +
            '<small style="margin-top:6px;display:block;line-height:1.6">' +
            'The name on file may be spelled differently.<br>Check Settings → Notification check.</small>';
    } else {
      const LABEL = { orders:'open', issue:'issue', completed:'completed',
                      claim:'claim', closed:'closed' };
      why = '<p>' + (LABEL[_activeTab] || '') + ' orders</p>' +
            '<small style="margin-top:6px;display:block">My orders: ' + _allOrders.length +
            ' — check the other tabs</small>';
    }
    list.innerHTML = '<div class="empty"><i class="ti ti-clipboard-off"></i>' + why + '</div>';
    return;
  }

  // The notices block used to sit above the order list. It has its own tab now,
  // and a long reference sheet pushed the actual jobs below the fold — the one
  // thing this screen exists to show. The per-order area chip still flags that
  // a notice applies.
  list.innerHTML = orders.map(o => {
    const st = o.status || 'active';
    const col = SB_ST_COL[st] || '#007AFF';
    const lbl = SB_ST_LBL[st] || (st.charAt(0).toUpperCase() + st.slice(1));
    const meta = [o.area, o.prn ? 'PRN ' + o.prn : ''].filter(Boolean).join(' · ');
    return '<div class="order-card" style="border-left:4px solid ' + col + '" onclick="sbOpenOrder(\'' + o.id + '\')">' +
      '<div class="oc-top">' +
        '<span class="order-num">' + esc(o.orderNumber || '') + '</span>' +
        '<button class="oc-copy" id="cp-' + o.id + '" title="Copy order details" ' +
          'onclick="event.stopPropagation();sbCopyOrder(\'' + o.id + '\')">&#9112;</button>' +
        '<span class="oc-badge" style="background:' + col + '1e;color:' + col + '">' + lbl + '</span>' +
      '</div>' +
      '<div class="order-addr">' + esc(o.address || 'No address') + '</div>' +
      (meta ? '<div class="order-meta">' + esc(meta) + '</div>' : '') +
      (o.comments ? '<div class="oc-comment">&#128172; ' + esc(o.comments) + '</div>' : '') +
      ((docBadge(o.id) || noticeChip(o.area))
        ? '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">' + noticeChip(o.area) + docBadge(o.id) + '</div>' : '') +
      sbCardActions(o) +

  }).join('');
}

// Order fields, in the order a subbie standing at the door needs them:
// where → what → when → who. Empty fields are dropped rather than shown blank.
function sbDetailFields(o) {
  const row = (k, v, cls) => !v ? '' :
    '<div class="dm-row"><div class="dm-k">' + k + '</div>' +
    '<div class="dm-v' + (cls ? ' ' + cls : '') + '">' + esc(String(v)) + '</div></div>';

  const date = (v) => {
    if (!v) return '';
    const d = new Date(v);
    if (isNaN(d)) return String(v);
    return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  let html =
    row('Address',    o.address) +
    row('Area',       o.area) +
    row('Work Type',  o.workType) +
    row('SOR Code',   o.sorCode, 'mono') +
    row('Order Date', date(o.orderDate)) +
    row('Supervisor', o.supervisor) +
    row('PRN',        o.prn, 'mono') +
    row('Assigned',   o.subbies);

  html += row('Completed', date(o.completedAt));

  // The two free-text fields. These are where the office writes what actually
  // has to happen on site, so they get blocks rather than one-line rows —
  // they are usually multi-line and are the whole point of opening the order.
  if (o.detail) {
    html += '<div class="dm-block">' +
      '<div class="dm-block-t" style="color:var(--blue)"><i class="ti ti-list-details"></i>Work Detail</div>' +
      '<div class="dm-block-b">' + esc(o.detail) + '</div></div>';
  }
  if (o.comments) {
    html += '<div class="dm-block" style="background:rgba(255,149,0,.09)">' +
      '<div class="dm-block-t" style="color:var(--orange)"><i class="ti ti-message-2"></i>Comments</div>' +
      '<div class="dm-block-b">' + esc(o.comments) + '</div></div>';
  }

  if (!html) html = '<div style="font-size:13px;color:var(--text3);padding:8px 0">No details available</div>';
  return html;
}

function sbOpenOrder(id) {
  _currentOrder = _allOrders.find(o => o.id === id);
  if (!_currentOrder) return;
  const o = _currentOrder;
  const st = o.status || 'active';

  document.getElementById('dm-num').textContent = o.orderNumber || '';
  document.getElementById('dm-title').textContent = o.address || 'No address';

  const stColors = {active:'#007AFF',completed:'#34C759',invoiced:'#FF9500',paid:'#AF52DE',
                    cancelled:'#FF3B30',issue:'#FF9500',claim:'#AF52DE',closed:'#8A8A8E'};
  const stText   = {issue:'Issue reported — office reviewing', claim:'Claim in progress', closed:'Settled'};
  document.getElementById('dm-status').innerHTML =
    '<span style="display:inline-flex;align-items:center;gap:6px;background:' + (stColors[st]||'#007AFF') + '18;color:' + (stColors[st]||'#007AFF') + ';font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px">' +
    '<div style="width:6px;height:6px;border-radius:50%;background:' + (stColors[st]||'#007AFF') + '"></div>' +
    (stText[st] || (st.charAt(0).toUpperCase() + st.slice(1))) + '</span>';

  // The old version showed area / workType / description / scope only. Three of
  // those four are not even fields on an order ('description' and 'scope' never
  // existed — the real names are 'detail' and 'comments'), so in practice the
  // sheet was blank. Render from the actual schema instead.
  document.getElementById('dm-fields').innerHTML =
    sbDetailFields(o) + docListHtml(o.id, _user || 'Subcontractor');

  // Reset upload UI
  sbClearPhotos();
  // Only offer it while there is still work to finish.
  const dw = document.getElementById('dm-done-wrap');
  if (dw) dw.style.display = ['completed','claim','invoiced','paid','closed','cancelled'].includes(st) ? 'none' : '';
  document.getElementById('issue-note').value = '';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Submit issue';

  // Load past issues for this order
  sbLoadIssues(id);

  document.getElementById('detail-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('open');
  _currentOrder = null;
  sbClearPhotos();
}

// ══════════════════════════════════════════
// ISSUE UPLOAD
// ══════════════════════════════════════════
const MAX_PHOTOS = 4;
let _photos = [];   // [{file, url}]

function sbPickPhoto() {
  if (_photos.length >= MAX_PHOTOS) return sbShowToast('Up to ' + MAX_PHOTOS + ' photos');
  document.getElementById('photo-input').click();
}

async function sbPhotoChosen(input) {
  const picked = Array.from(input.files || []);
  input.value = '';
  if (!picked.length) return;
  const room = MAX_PHOTOS - _photos.length;
  if (picked.length > room) sbShowToast(room ? room + ' added' : 'Up to ' + MAX_PHOTOS + ' photos');
  for (const f of picked.slice(0, room)) {
    // Stamp instead of just shrinking — stampPhoto resizes as part of the same
    // canvas pass, so the photo is only re-encoded once.
    const done = await stampPhoto(f, _currentOrder);
    const entry = { file: done, url: URL.createObjectURL(done), state: 'uploading', url_remote: null };
    _photos.push(entry);
    sbRenderPhotos();
    // Upload straight away, while the note is still being typed. Submit then
    // has nothing left to wait for on a normal connection.
    entry.task = sbUploadOne(entry);
  }
  sbRenderPhotos();
}

async function sbUploadOne(entry) {
  try {
    if (!_storage) throw new Error('Storage not ready');
    const ref = _storage.ref('issues/' + (_currentOrder ? _currentOrder.id : 'unknown') + '/' +
                             Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.jpg');
    await ref.put(entry.file);
    entry.url_remote = await ref.getDownloadURL();
    entry.state = 'done';
  } catch (e) {
    console.error('[SB] photo upload failed:', e.code || e.message, e);
    entry.state = 'failed';
    entry.err = e;
  }
  sbRenderPhotos();
}

function sbRemovePhoto(i) {
  const p = _photos[i];
  if (!p) return;
  if (p.url) URL.revokeObjectURL(p.url);
  _photos.splice(i, 1);
  sbRenderPhotos();
  // The upload already started when the photo was added, so clean up the copy
  // in Storage as well. Wait for an in-flight upload to finish before deleting.
  Promise.resolve(p.task).then(() => {
    if (!p.url_remote || !_storage) return;
    _storage.refFromURL(p.url_remote).delete()
      .catch(e => console.warn('[SB] could not delete photo:', e.code || e.message));
  });
}

function sbRenderPhotos() {
  const grid = document.getElementById('photo-grid');
  if (grid) grid.innerHTML = _photos.map((p, i) => {
    const mark = p.state === 'done'   ? ''
               : p.state === 'failed' ? '<div style="position:absolute;inset:0;background:rgba(255,59,48,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">retry</div>'
               : '<div style="position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">…</div>';
    return '<div class="ph-cell"><img src="' + p.url + '" alt="">' + mark +
      '<button class="ph-del" onclick="sbRemovePhoto(' + i + ')">&times;</button></div>';
  }).join('');
  const c = document.getElementById('photo-count');
  if (c) c.textContent = _photos.length ? '(' + _photos.length + '/' + MAX_PHOTOS + ')' : '';
  const b = document.getElementById('add-photo-btn');
  if (b) b.disabled = _photos.length >= MAX_PHOTOS;
}

function sbClearPhotos() {
  _photos.forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
  _photos = [];
  sbRenderPhotos();
}

// A modern phone photo is 4-6 MB. Four of those over site mobile data is a long
// wait and a failed upload as often as not. 1600px at q0.75 is still far more
// than enough to see a cracked tile or the wrong fitting.
function sbShrink(file, maxDim = 1600, quality = 0.75) {
  return new Promise(resolve => {
    if (!/^image\//.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 900000) return resolve(file);
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b ? new File([b], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg',
        { type: 'image/jpeg' }) : file), 'image/jpeg', quality);
    };
    // A HEIC or otherwise undecodable file goes up as-is rather than failing.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function sbReportDone() {
  if (!_currentOrder) return;
  if (!confirm((_currentOrder.orderNumber || '') + '\n' + (_currentOrder.address || '') +
               '\n\nReport this job as finished?')) return;
  const btn = document.getElementById('done-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    await _sbWriteReport('done', '', []);
    sbShowToast('Completion report sent ✓');
    closeModal();
  } catch (e) {
    _sbReportError(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-circle-check"></i> Report work done';
  }
}

// Reports go to /issues, the node the app has always written to and which is
// already open in the rules. Routing them through a brand new /issueReports
// path meant nothing worked until someone published a rules change by hand —
// a silent dependency that turned "report an issue" into permission_denied.
async function _sbWriteReport(type, note, urls) {
  const ts = Date.now();
  await _db.ref('/issues/' + _currentOrder.id + '/' + ts).set({
    type:        type,                    // 'issue' | 'done'
    note:        note || '',
    photoUrl:    urls[0] || '',           // kept for older readers
    photoUrls:   urls,
    photoCount:  urls.length,
    orderId:     _currentOrder.id,
    orderNumber: _currentOrder.orderNumber || '',
    address:     _currentOrder.address || '',
    createdAt:   ts,
    createdBy:   _user,
    by:          _user,
    at:          ts
  });
  return ts;
}

// "업로드 실패 — 다시 시도해주세요" was useless: retrying a permission error
// fails identically forever. Say what actually went wrong.
function _sbReportError(e) {
  const code = (e && (e.code || '')) + '';
  const msg  = (e && (e.message || '')) + '';
  console.error('[REPORT]', code, msg);
  if (/permission|PERMISSION_DENIED/i.test(code + msg)) {
    alert('Blocked by the database rules.\n\n' +
          'Ask the office to publish the Firebase rules.\n\n' + (code || msg));
  } else if (/unauthorized|storage\//i.test(code)) {
    alert('No permission to upload photos.\n\n' +
          'Ask the office to publish the Storage rules.\n\n' + (code || msg));
  } else if (!navigator.onLine) {
    alert('You are offline. Check your connection and try again.');
  } else {
    alert('Send failed\n\n' + (msg || code || 'Unknown error'));
  }
}

async function sbSubmitIssue() {
  if (!_currentOrder) return;
  const note = document.getElementById('issue-note').value.trim();
  if (!_photos.length && !note) { sbShowToast('Add a photo or a note first'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  try {
    // Photos started uploading the moment they were added, so this usually
    // resolves instantly. Only a just-added photo is still in flight.
    if (_photos.length) {
      btn.textContent = _photos.some(p => p.state === 'uploading') ? 'Finishing photos…' : 'Submitting…';
      await Promise.all(_photos.map(p => p.task).filter(Boolean));
    } else {
      btn.textContent = 'Submitting…';
    }
    const urls   = _photos.filter(p => p.url_remote).map(p => p.url_remote);
    const failed = _photos.filter(p => p.state === 'failed');

    await _sbWriteReport('issue', note, urls);

    if (failed.length) {
      const c = (failed[0].err && (failed[0].err.code || failed[0].err.message)) || '';
      alert('The issue was sent, but ' + failed.length + ' photo(s) failed to upload.\n\n' + c);
    } else {
      sbShowToast('Issue sent to the office ✓');
    }
    document.getElementById('issue-note').value = '';
    sbClearPhotos();
    sbLoadIssues(_currentOrder.id);

  } catch (e) {
    _sbReportError(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit issue';
  }
}

function sbLoadIssues(orderId) {
  if (!_db) return;
  const container = document.getElementById('past-issues');
  _db.ref('/issues/' + orderId).once('value', snap => {
    const data = snap.val() || {};
    const items = Object.entries(data).sort((a,b) => Number(b[0])-Number(a[0]));
    if (!items.length) { container.innerHTML = ''; return; }
    container.innerHTML =
      '<div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;margin-top:12px">Previous Issues (' + items.length + ')</div>' +
      items.map(([ts, issue]) =>
        '<div class="issue-item">' +
          '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">' +
            new Date(Number(ts)).toLocaleDateString('en-AU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) +
            ' · ' + esc(issue.createdBy || '') +
          '</div>' +
          (issue.note ? '<div style="color:var(--text1);margin-bottom:4px">' + esc(issue.note) + '</div>' : '') +
          ((issue.photoUrls && issue.photoUrls.length ? issue.photoUrls : (issue.photoUrl ? [issue.photoUrl] : []))
            .map(u => '<img src="' + u + '" alt="issue photo" onclick="window.open(this.src)" style="width:100%;border-radius:8px;cursor:zoom-in;margin-top:6px">').join('')) +
        '</div>'
      ).join('');
  });
}

// SETTINGS SHEET
// ══════════════════════════════════════════
// A subbie needs far less than the office does. The only real question they
// have is "will my phone actually ring when a job comes in?" — so the sheet is
// built around answering that, plus who am I signed in as.
//
// Deliberately NOT here: sync-address (subbies read RTDB directly, they never
// touch Apps Script), push registry (admin-only, and the rules deny it), and
// the device lock (subbie.html has no PIN/Face ID).

function sbOpenSettings() {
  sbRenderSettings();
  document.getElementById('set-overlay').classList.add('open');
}
function sbCloseSettings() {
  document.getElementById('set-overlay').classList.remove('open');
}

function _sbPushState() {
  if (typeof Notification === 'undefined' || !('serviceWorker' in navigator))
    return { key: 'unsupported', label: 'Not supported',  color: 'var(--text3)' };
  if (Notification.permission === 'granted')
    return { key: 'on',          label: 'ON',        color: 'var(--green)' };
  if (Notification.permission === 'denied')
    return { key: 'blocked',     label: 'Blocked',     color: 'var(--red)' };
  return   { key: 'off',         label: 'OFF',       color: 'var(--text3)' };
}

// iOS only delivers web push to a Home Screen app installed from Safari.
// A Chrome/Firefox/Edge shortcut looks identical to the user but can never
// receive a background notification, so it is worth saying out loud.
function _sbIosPushBlocker() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  if (!isIOS) return null;
  if (/CriOS|FxiOS|EdgiOS/.test(ua)) return 'Shortcuts created in Chrome or Firefox cannot receive alerts. Re-add it to your Home Screen using Safari.';
  const standalone = window.navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;
  if (!standalone) return 'On iPhone, add this to your Home Screen so alerts arrive when the app is closed. Safari → Share → Add to Home Screen.';
  return null;
}

function sbRenderSettings() {
  const push  = _sbPushState();
  const email = (_sbAuth && _sbAuth.currentUser && _sbAuth.currentUser.email) || '—';
  const warn  = _sbIosPushBlocker();

  const row = (ico, bg, col, title, desc, right, onclick) =>
    '<div class="set-row' + (onclick ? '' : ' static') + '"' +

      '<div class="set-txt"><div class="set-t">' + title + '</div>' +
        (desc ? '<div class="set-d">' + desc + '</div>' : '') + '</div>' +
      (right || '') +
      (onclick ? '<i class="ti ti-chevron-right set-chev"></i>' : '') +
    '</div>';

  document.getElementById('set-body').innerHTML =
    // ── Notifications ──
    '<div class="set-group">' +
      '<div class="set-label">Notifications</div>' +
      '<div class="set-card">' +
        row('bell', 'rgba(255,149,0,.14)', 'var(--orange)',
            'Notifications',
            push.key === 'blocked' ? 'Re-enable this in your browser settings'
          : push.key === 'on'      ? 'You will be alerted when a job is assigned'
          : 'Turn on to get new jobs straight away',
            '<span class="set-val" style="color:' + push.color + '">' + push.label + '</span>',
            push.key === 'off' ? 'sbSettingsEnablePush()' : null) +
        row('bell-ringing', 'rgba(0,122,255,.14)', 'var(--blue)',
            'Test notification', 'Sends one notification to this device now',
            '', 'sbTestNotification()') +
        row('stethoscope', 'rgba(88,86,214,.14)', 'var(--purple)',
            'Notification check', 'Find out why alerts are not arriving',
            '', 'sbNotifDiagnostics()') +
      '</div>' +
      (warn ? '<div style="font-size:12px;color:var(--orange);padding:8px 6px 0;line-height:1.5">' +
                '<i class="ti ti-alert-triangle"></i> ' + esc(warn) + '</div>' : '') +
    '</div>' +

    // ── Connection ──
    '<div class="set-group">' +
      '<div class="set-label">Connection</div>' +
      '<div class="set-card">' +
        row('cloud-check', 'rgba(52,199,89,.14)', 'var(--green)',
            'Order sync', online ? 'Connected in real time' : 'Checking the connection',
            '<span class="set-val" style="color:' + (online ? 'var(--green)' : 'var(--text3)') + '">' +
              (online ? 'Live' : 'Waiting') + '</span>', null) +
        row('refresh-alert', 'rgba(0,122,255,.14)', 'var(--blue)',
            'Hard refresh', 'Fetches the latest build',
            '', 'hardReload()') +
      '</div>' +
    '</div>' +

    // ── Account ──
    '<div class="set-group">' +
      '<div class="set-label">Account</div>' +

            esc(_user || '—'), esc(email), '', null) +
        row('logout', 'rgba(255,59,48,.14)', 'var(--red)',
            'Sign out', '', '', 'sbLogout()') +
      '</div>' +
      '<div style="text-align:center;font-size:11px;color:var(--text3);padding:14px 0 0">Build ' + APP_BUILD + '</div>' +

async function sbSettingsEnablePush() {
  const p = await Notification.requestPermission();
  if (p === 'granted') { await sbFcmRegister(); sbShowToast('Notifications are on'); }
  else sbShowToast('Notifications were not allowed');
  sbRenderSettings();
}

// Goes through the service worker rather than `new Notification()` — that is
// the same path a real push takes, so a pass here means the whole chain works,
// not just that the permission flag is set.
async function sbTestNotification() {
  if (typeof Notification === 'undefined') return sbShowToast('This device does not support notifications');
  if (Notification.permission !== 'granted') return sbShowToast('Turn notifications on first');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) {
      await reg.showNotification('Test notification', {
        body: 'Notifications are working ✓',
        icon: 'icon-192.png', badge: 'icon-192.png', tag: 'sb-test'
      });
    } else {
      new Notification('Test notification', { body: 'Notifications are working ✓' });
    }
    sbShowToast('Notification sent');
  } catch (e) {
    sbShowToast('Could not send: ' + (e.message || e));
  }
}

async function sbNotifDiagnostics() {
  const L = [];
  const ok = (t) => L.push('✅ ' + t);
  const no = (t) => L.push('❌ ' + t);
  const wa = (t) => L.push('⚠️ ' + t);

  typeof Notification !== 'undefined' ? ok('Browser notifications supported') : no('Browser notifications not supported');
  'serviceWorker' in navigator     ? ok('Service worker supported')   : no('Service worker not supported');

  const perm = typeof Notification !== 'undefined' ? Notification.permission : 'unsupported';
  perm === 'granted' ? ok('Notification permission granted')
    : perm === 'denied' ? no('Notifications blocked — allow them in browser settings')
    : wa('Notifications not set up — turn them on in Settings');

  try {
    const reg = await navigator.serviceWorker.getRegistration();
    reg ? ok('Service worker registered') : no('Service worker not registered');
  } catch (e) { no('Could not check the service worker'); }

  // The single most common cause of "it works in the app but not when closed".
  const blocker = _sbIosPushBlocker();
  if (blocker) wa(blocker); else ok('Install state OK');

  // Token must be filed under the name the server looks up, or the Cloud
  // Function finds nothing and returns silently — no error anywhere.
  if (_user && _db) {
    try {
      const key  = _user.replace(/\s+/g, '_');
      const snap = await _db.ref('/fcmTokens/' + key).get();
      const n = snap.exists() ? Object.keys(snap.val()).length : 0;
      n > 0 ? ok('Push registered (' + key + ' ·  devices ' + n + ')')
            : no('Push not registered (' + key + ') — turn notifications off and on again');
    } catch (e) {
      // fcmTokens is admin-read-only by design, so a subcontractor account can
      // never read this back. Reporting it as a warning made a correct setup
      // look broken every single time.
      ok('Push registered (details are admin-only)');
    }
  }

  _db && _ordersListener ? ok('Orders connected live') : wa('Order connection needs checking');

  // The most common "my app is empty" cause, made visible.
  // _mirrorSize: 0 = nothing sent yet, -1 = data exists but none matched me.
  if (_allOrders.length) {
    ok('My orders: ' + _allOrders.length + '');
  } else if (_mirrorSize === 0) {
    no('No order data has been sent from the office — contact the office');
  } else {
    // Saying "your name does not match" was a guess dressed up as a finding: an
    // empty result also happens when the records simply predate the indexed
    // field. Read the mirror and report what is actually in there — the names
    // present settle it in one line instead of sending someone hunting.
    no('Could not find your orders (account name: "' + (_user || '') + '")');
    try {
      const snap = await _db.ref('/orders').once('value');
      const all  = Object.values(snap.val() || {});
      const withKey = all.filter(o => o && o.subbieKey).length;
      const names = [...new Set(all.map(o => (o && o.subbies || '').trim()).filter(Boolean))].sort();
      L.push('   Total orders ' + all.length + ' · with name tag ' + withKey + '');
      if (!withKey) L.push('   → Old-format data. It sorts itself out once an office app runs the latest build.');
      else if (names.length) L.push('   Names on file: ' + names.slice(0, 12).join(', ') +
        (names.length > 12 ? ' +' + (names.length - 12) + ' more' : ''));
    } catch (e) {
      L.push('   Could not read the list: ' + (e.message || e));
    }
  }

  alert('Notification check\n\n' + L.join('\n') +
        '\n\nAccount: ' + (_user || '—') + '\nBuild: ' + APP_BUILD);
}

// ══════════════════════════════════════════
// FCM PUSH NOTIFICATIONS
// ══════════════════════════════════════════
function sbFcmSetup() {
  if (!('serviceWorker' in navigator)) return;
  if (typeof Notification === 'undefined') return;

  if (Notification.permission === 'granted') {
    sbFcmRegister();
    return;
  }
  if (Notification.permission !== 'denied') {
    // Show enable bar after a short delay
    setTimeout(() => {
      document.getElementById('fcm-bar').style.display = 'flex';
    }, 1500);
  }
}

async function sbFcmEnable() {
  document.getElementById('fcm-bar').style.display = 'none';
  const permission = await Notification.requestPermission();
  if (permission === 'granted') sbFcmRegister();
}

async function sbFcmRegister() {
  try {
    if (!firebase || !_user) return;
    if (!_messaging) _messaging = firebase.messaging(_app);

    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const token = await _messaging.getToken({ vapidKey: _FCM_VAPID, serviceWorkerRegistration: reg });
    if (!token) return;

    // Stable device ID
    let deviceId = localStorage.getItem('fcm_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).slice(2, 12);
      localStorage.setItem('fcm_device_id', deviceId);
    }

    // Normalise name for RTDB key ("Jake Lee" → "Jake_Lee")
    const fcmKey = _user.replace(/\s+/g, '_');
    await _db.ref('/fcmTokens/' + fcmKey + '/' + deviceId).set(token);
    console.log('[FCM] Registered as', fcmKey);

    // Foreground messages
    _messaging.onMessage(payload => {
      const title = payload.notification?.title || 'New Order';
      const body  = payload.notification?.body  || '';
      sbShowFcmBanner(title, body);
    });

  } catch (err) {
    console.error('[FCM] Error:', err);
  }
}

function sbShowFcmBanner(title, body) {
  const el = document.getElementById('fcm-notif-banner');
  el.innerHTML =
    '<div style="width:32px;height:32px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
      '<i class="ti ti-bell-ringing" style="font-size:16px;color:#fff"></i>' +
    '</div>' +
    '<div style="flex:1;min-width:0;margin-left:10px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:2px">' + esc(title) + '</div>' +
      '<div style="font-size:12px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(body) + '</div>' +
    '</div>' +
    '<button onclick="this.parentElement.style.display=\'none\'" style="background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:0 0 0 10px">&times;</button>';
  el.style.display = 'flex';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer;
function sbShowToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modal on overlay tap
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Kick off
document.addEventListener('DOMContentLoaded', sbInit);
</script>
