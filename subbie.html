<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SK Field App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="theme-color" content="#1C1C1E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#F2F1EC;--card:#fff;--border:#E5E5E0;--text1:#1C1C1E;--text2:#3C3C43;
      --text3:#8A8A8E;--blue:#007AFF;--green:#34C759;--orange:#FF9500;
      --red:#FF3B30;--purple:#5856D6;--yellow:#FFCC00;
    }
    html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--text1);overflow:hidden}

    /* ── LOGIN ── */
    #login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:calc(52px + env(safe-area-inset-top))}
    .login-logo{width:72px;height:72px;border-radius:20px;background:#1C1C1E;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .login-logo img{width:52px;height:52px;object-fit:contain}
    .login-title{font-size:24px;font-weight:800;text-align:center;letter-spacing:-.4px;margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:36px}
    .name-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
    .name-row{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;cursor:pointer;user-select:none;transition:border-color .15s,box-shadow .15s}
    .name-row:active{box-shadow:0 0 0 3px rgba(88,86,214,.18);border-color:var(--purple)}
    .name-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
    .name-label{font-size:16px;font-weight:700;color:var(--text1)}

    /* ── MAIN APP ── */
    #app{display:none;flex-direction:column;height:100%}
    #app.visible{display:flex}

    /* Header */
    #hdr{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:10px;height:calc(56px + env(safe-area-inset-top));flex-shrink:0}
    #hdr-name{font-size:16px;font-weight:800;color:var(--text1);flex:1}
    #hdr-badge{background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
    .hdr-btn{width:36px;height:36px;border-radius:10px;border:none;background:rgba(60,60,67,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}

    /* Tab bar */
    #tabs{background:var(--card);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:none;background:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;font-family:inherit}
    .tab i{font-size:22px}
    .tab-n{position:absolute;top:2px;right:50%;margin-right:-24px;background:var(--purple);color:#fff;
      font-size:9px;font-weight:800;min-width:15px;padding:1px 4px;border-radius:9px;line-height:1.4}
    .tab-n:empty{display:none}
    .tab{position:relative}
    .tab.active{color:var(--purple)}

    /* Content */
    #content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}

    /* Order cards */
    .order-card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:transform .1s}
    .order-card:active{transform:scale(0.98)}
    .order-num{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.3px;margin-bottom:4px}
    .order-addr{font-size:15px;font-weight:700;color:var(--text1);margin-bottom:4px;line-height:1.3}
    .order-meta{font-size:12px;color:var(--text3);display:flex;gap:8px;align-items:center}
    .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* Status colours */
    .s-active{background:var(--blue)}
    .s-completed{background:var(--green)}
    .s-invoiced{background:var(--orange)}
    .s-paid{background:#AF52DE}
    .s-cancelled{background:var(--red)}
    .s-issue{background:var(--orange)}
    .s-claim{background:#AF52DE}
    .s-closed{background:var(--text3)}
    .issue-flag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,149,0,.14);
      color:var(--orange);font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}

    /* Empty state */
    .empty{text-align:center;padding:60px 24px;color:var(--text3)}
    .empty i{font-size:48px;margin-bottom:12px;display:block}
    .empty p{font-size:15px;font-weight:600}
    .empty small{font-size:13px}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.45);display:none;align-items:flex-end}
    .modal-overlay.open{display:flex}
    .modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
    .modal-handle{width:36px;height:4px;border-radius:2px;background:rgba(60,60,67,.25);margin:10px auto}
    .modal-hdr{padding:0 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-close{background:rgba(60,60,67,.08);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2)}
    .modal-body{padding:16px}

    /* Issue upload */
    .issue-section{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
    .issue-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text2);display:flex;align-items:center;gap:6px}
    .upload-btn{width:100%;padding:13px;background:var(--bg);border:1.5px dashed var(--border);border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
    .upload-btn:active{background:#E8E8E0}
    .issue-note{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text1);resize:none;margin-top:8px}
    .issue-note:focus{outline:none;border-color:var(--purple)}
    .submit-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
    .submit-btn:active{opacity:.85}
    .submit-btn:disabled{background:var(--text3);cursor:not-allowed}
    #photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
    #photo-grid:empty{display:none}
    .ph-cell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--bg)}
    .ph-cell img{width:100%;height:100%;object-fit:cover;display:block}
    .ph-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;
      background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:flex;
      align-items:center;justify-content:center;padding:0}
    .upload-btn:disabled{opacity:.45;cursor:not-allowed}
    .photo-preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
    .issue-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .issue-item{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px}
    .issue-item img{width:100%;border-radius:8px;margin-top:6px}

    /* Detail fields — label/value rows, same shape as the office app so a
       subbie reading a job over the phone is looking at the same layout. */
    .dm-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
    .dm-row:last-child{border-bottom:none}
    .dm-k{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;width:96px;flex-shrink:0;padding-top:2px}
    .dm-v{font-size:14px;color:var(--text1);flex:1;min-width:0;line-height:1.45;word-break:break-word}
    .dm-v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
    .dm-block{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px}
    .dm-block-t{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .dm-block-b{font-size:14px;color:var(--text1);white-space:pre-wrap;line-height:1.55}

    /* ── SETTINGS SHEET ── */
    .set-group{margin-bottom:18px}
    .set-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;padding:0 4px 8px}
    .set-card{background:var(--bg);border-radius:14px;overflow:hidden}
    .set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
    .set-row:last-child{border-bottom:none}
    .set-row:active{background:#E8E8E0}
    .set-row.static{cursor:default}
    .set-row.static:active{background:none}
    .set-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .set-txt{flex:1;min-width:0}
    .set-t{font-size:15px;font-weight:600;color:var(--text1)}
    .set-d{font-size:12px;color:var(--text3);margin-top:1px}
    .set-val{font-size:13px;font-weight:700;flex-shrink:0}
    .set-chev{color:var(--text3);font-size:16px;flex-shrink:0}

    /* Toast */
    #toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
    #toast.show{opacity:1}

    /* FCM banner */
    #fcm-bar{display:none;position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:9998;background:#1C1C1E;border-radius:14px;padding:12px 14px;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
    #fcm-bar span{flex:1;font-size:13px;color:#fff;font-weight:600}
    #fcm-bar button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}

    @keyframes fcmSlideIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    #fcm-notif-banner{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;border-radius:14px;padding:12px 16px;z-index:99999;max-width:calc(100vw - 32px);width:340px;box-shadow:0 4px 20px rgba(0,0,0,.25);display:none;gap:10px;align-items:flex-start;animation:fcmSlideIn .3s ease}
  </style>
</head>
<body>

<script>
// Ctrl+Shift+R has no equivalent on a phone, and an installed PWA will happily
// serve a stale cached build for days. This clears the caches and reloads with
// a fresh query string. It does NOT touch localStorage — that is the data — and
// it updates the service worker rather than unregistering it, which would kill
// push notifications.
async function hardReload() {
  if (!confirm('앱을 강제로 새로고침할까요?\n\n최신 버전을 다시 받아옵니다.\n저장된 데이터는 지워지지 않습니다.')) return;
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.update().catch(() => {})));
    }
  } catch (e) { console.warn('[RELOAD] cache clear failed:', e); }
  const base = location.origin + location.pathname;
  location.replace(base + '?v=' + Date.now());
}

const SUBBIE_COLORS = { 'Jake Lee':'#FF6B35', 'Sean Park':'#007AFF', 'Chris Choi':'#34C759' };

// STATE
// ══════════════════════════════════════════
let _app, _db, _storage, _messaging;
let _user = null;          // logged-in name
let _allOrders = [];       // orders from RTDB
let _activeTab = 'orders'; // orders | completed | issues
let _currentOrder = null;  // order open in modal
let _ordersListener = null;

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function _waitForFirebase(cb, attempts) {
  if (typeof firebase !== 'undefined') { cb(); return; }
  if (attempts > 0) { setTimeout(() => _waitForFirebase(cb, attempts - 1), 250); }
}

// ══════════════════════════════════════════
// GOOGLE SIGN-IN
// ----------------------------------------------------------
// Login used to be: tap your name. No password, no verification — anyone with
// the link could read anyone's orders. It also read the database
// unauthenticated, which blocks locking the rules down at all.
//
// Identity now comes from the allow-list entry, so a subbie sees only the work
// filed under their own name.
// ══════════════════════════════════════════

const _SB_ALL_GROUPS = ['admin','SK_Jacob','SK_Mo','SK_June','SK_Jay','Jake_Lee','Chris_Choi','Sean_Park'];
let _sbAuth = null;

function _sbEmailKey(e) { return (e||'').trim().toLowerCase().replace(/\./g, ','); }

function _sbErr(msg) {
  const el = document.getElementById('sb-login-err');
  if (!el) return;
  el.textContent = msg || '';
  el.style.display = msg ? 'block' : 'none';
}

function _sbFirebase() {
  if (typeof firebase === 'undefined' || !firebase.auth) return false;
  if (!_app) _app = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(_FB_CONFIG);
  _db      = firebase.database(_app);
  _storage = firebase.storage(_app);
  _sbAuth  = firebase.auth(_app);
  return true;
}

async function sbGoogleSignIn() {
  _sbErr('');
  if (!_sbFirebase()) { _sbErr('Firebase를 불러오지 못했습니다. 네트워크를 확인해주세요.'); return; }
  try {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    await _sbAuth.signInWithPopup(p);
  } catch (e) {
    const c = e.code;
    _sbErr(c === 'auth/popup-blocked'      ? '팝업이 차단되었습니다. 브라우저 설정에서 허용해주세요.'
         : c === 'auth/unauthorized-domain'? '이 주소가 Firebase에 등록되지 않았습니다.'
         : c === 'auth/popup-closed-by-user' ? '로그인 창이 닫혔습니다. 다시 시도해주세요.'
         : (e.message || '로그인에 실패했습니다.'));
  }
}

async function sbSignOut() {
  try { localStorage.removeItem('sb_user'); if (_sbAuth) await _sbAuth.signOut(); } catch (e) {}
  location.reload();
}

function _sbWatchAuth() {
  if (!_sbFirebase()) return;
  _sbAuth.onAuthStateChanged(async (user) => {
    if (!user) {
      document.getElementById('login-screen').style.display = '';
      document.getElementById('app').classList.remove('visible');
      return;
    }
    try {
      const snap = await _db.ref('/allowedUsers/' + _sbEmailKey(user.email)).once('value');
      if (!snap.exists()) {
        await _sbAuth.signOut();
        _sbErr(user.email + ' 계정은 등록되어 있지 않습니다.\n관리자에게 등록을 요청해주세요.');
        return;
      }
      const entry = snap.val() || {};
      const name  = entry.name || '';
      if (!name) {
        await _sbAuth.signOut();
        _sbErr('계정에 이름이 지정되어 있지 않습니다.\n관리자에게 문의해주세요.');
        return;
      }

      // Staff who land here get moved to the app that fits their role, rather
      // than a restricted view of their own work. One link works for everyone.
      if ((entry.role || '') !== 'subbie') {
        const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        document.getElementById('sb-login-sub').textContent = '직원 앱으로 이동합니다…';
        location.replace(isPhone ? 'mobile.html' : 'index.html');
        return;
      }

      sbLogin(name, true);
    } catch (e) {
      _sbErr('권한 확인에 실패했습니다.\n' + (e.message || ''));
    }
  });
}

function sbInit() {
  const b = document.getElementById('sb-build');
  if (b) b.textContent = APP_BUILD;
  _sbWatchAuth();

  // No name-based auto-login any more: identity comes from the Google session,
  // which onAuthStateChanged restores on its own.
}

function sbLogin(name, auto) {
  _user = name;
  localStorage.setItem('sb_user', name);

  // Update header
  document.getElementById('hdr-name').textContent = name.split(' ')[0] + "'s Orders";
  document.title = name + ' — SK Field App';

  // Show app, hide login
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');

  // Init Firebase and load orders
  _waitForFirebase(() => {
    if (!firebase.apps.length) {
      _app = firebase.initializeApp(_FB_CONFIG);
    } else {
      _app = firebase.apps[0];
    }
    _db      = firebase.database(_app);
    _storage = firebase.storage(_app);

    sbLoadOrders();
    sbFcmSetup();
  }, 30);

  if (!auto) sbShowToast('Welcome, ' + name.split(' ')[0] + '!');
}

function sbLogout() {
  if (!confirm('로그아웃할까요?')) return;
  // This used to only hide the app and show the login screen again. The Google
  // session survived, so onAuthStateChanged immediately signed the same person
  // back in — the screen flashed and nothing changed. Identity now comes from
  // the session, so the session is what has to go.
  if (_ordersListener) { try { (_ordersQuery || _db.ref('/orders')).off('value', _ordersListener); } catch (e) {} _ordersListener = null; _ordersQuery = null; }
  _user = null;
  _allOrders = [];
  sbSignOut();          // clears the session, then reloads
}

// ══════════════════════════════════════════
// ORDERS — real-time from RTDB
// ══════════════════════════════════════════
// Must match _subbieKey() in index.html / mobile.html exactly — if the two
// drift, orders stop matching and the app looks empty rather than broken.
function _subbieKey(name) {
  return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}
let _mirrorSize = 0;

// Called only when a subbie's own query comes back empty. Distinguishes "the
// office has not sent anything yet" from "your name does not match what the
// office typed" — cheap, because it asks for a single record, not the node.
let _ordersQuery = null;
let _sbFellBack  = false;

// The indexed query matches on subbieKey, which only exists on records written
// by a recent build. Anything mirrored before that has no such field, so the
// query returns nothing and the app looks empty even though the data is there.
// Falling back to a full scan means the subbie never has to wait for the office
// to run anything — it just works, and goes back to the fast path once the
// office apps have re-mirrored (which they now do on their own).
async function _sbFallbackScan() {
  if (_sbFellBack) { _mirrorSize = -1; sbRender(); return; }
  _sbFellBack = true;
  try {
    const snap = await _db.ref('/orders').once('value');
    const data = snap.val() || {};
    const me   = _subbieKey(_user);
    const hits = Object.values(data).filter(o => o && _subbieKey(o.subbies) === me);
    if (hits.length) {
      console.log('[SB] indexed query empty — fell back to scan, found', hits.length);
      _allOrders  = hits;
      _mirrorSize = hits.length;
    } else {
      _mirrorSize = Object.keys(data).length ? -1 : 0;  // -1 = data exists, none mine
    }
  } catch (e) {
    _mirrorSize = 0;
  }
  sbRender();
}

function sbLoadOrders() {
  if (!_db || !_user) return;
  // Listen to all orders, filter client-side (RTDB can't filter by child on free plan without index)
  // Query by the indexed key instead of downloading every order and filtering
  // in the browser. With a few thousand mirrored orders the full-scan version
  // meant each subbie pulled the whole company's work over mobile data on every
  // launch. Works either way — without .indexOn Firebase just filters
  // server-side less efficiently and logs a warning.
  _ordersQuery = _db.ref('/orders').orderByChild('subbieKey').equalTo(_subbieKey(_user));
  _ordersListener = _ordersQuery.on('value', snap => {
    const data = snap.val() || {};
    // No age cutoff. An earlier version hid anything finished more than 90 days
    // ago, which also hid the record a subbie needs when checking what they did
    // and whether it was paid. The real problem was deleted orders lingering in
    // this mirror, and that is fixed at the source now.
    // Exact string equality was too strict: 'KH LEE' vs 'KH Lee', or a stray
    // trailing space typed into the order form, produced an empty list with no
    // hint as to why. Compare on the normalised key instead, and keep the raw
    // comparison as a fallback for records mirrored before subbieKey existed.
    const me = _subbieKey(_user);
    _allOrders = Object.values(data).filter(o => o && _subbieKey(o.subbies) === me);
    if (!_allOrders.length) _sbFallbackScan();  // indexed query found nothing
    else { _mirrorSize = _allOrders.length; _sbFellBack = false; }
    sbRender();
    // Update badge
    const active = _allOrders.filter(o => (o.status||'active') === 'active').length;
    const badge = document.getElementById('hdr-badge');
    if (active > 0) { badge.textContent = active; badge.style.display = ''; }
    else { badge.style.display = 'none'; }
  });
}

function sbTab(tab) {
  _activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  sbRender();
}

function sbRender() {
  const list = document.getElementById('order-list');
  let orders;
  const byNewest = (a, b) => (b.completedAt || b.updatedAt || 0) - (a.completedAt || a.updatedAt || 0);

  // One tab per office status, in the same order and under the same names as
  // the sidebar the office looks at. A subbie asking "where is my job up to?"
  // and the coordinator answering are now looking at the same word.
  const BUCKETS = {
    orders:    o => !['completed','invoiced','paid','cancelled','closed','claim','issue'].includes(o.status || 'active'),
    issue:     o => (o.status || '') === 'issue',
    completed: o => (o.status || '') === 'completed',
    claim:     o => ['claim','invoiced','paid'].includes(o.status || ''),
    closed:    o => (o.status || '') === 'closed',
  };
  orders = _allOrders.filter(BUCKETS[_activeTab] || BUCKETS.orders).sort(byNewest);

  // Counts on every tab, so an empty screen is obviously empty rather than
  // possibly broken — the subbie can see at a glance where their work sits.
  Object.keys(BUCKETS).forEach(k => {
    const el = document.getElementById('tn-' + k);
    if (!el) return;
    const n = _allOrders.filter(BUCKETS[k]).length;
    el.textContent = n || '';
  });

  if (!orders.length) {
    // "Nothing here" has three very different causes and they used to look
    // identical. Say which one it is, so the subbie knows whether to wait, to
    // ring the office, or that there is simply nothing on today.
    let why;
    if (_mirrorSize === 0) {
      why = '<p>오더를 불러오지 못했습니다</p>' +
            '<small style="margin-top:6px;display:block;line-height:1.6">' +
            '사무실에서 데이터를 아직 내려보내지 않았습니다.<br>관리자에게 문의해주세요.</small>';
    } else if (!_allOrders.length) {
      why = '<p>' + esc(_user || '') + ' 님에게 배정된 오더가 없습니다</p>' +
            '<small style="margin-top:6px;display:block;line-height:1.6">' +
            '사무실에 등록된 이름과 다를 수 있습니다.<br>설정 → 알림 진단에서 확인하세요.</small>';
    } else {
      const LABEL = { orders:'진행 중인', issue:'이슈로 등록된', completed:'완료한',
                      claim:'청구 중인', closed:'종료된' };
      why = '<p>' + (LABEL[_activeTab] || '해당') + ' 오더가 없습니다</p>' +
            '<small style="margin-top:6px;display:block">내 오더 ' + _allOrders.length +
            '건 — 다른 탭을 확인해보세요</small>';
    }
    list.innerHTML = '<div class="empty"><i class="ti ti-clipboard-off"></i>' + why + '</div>';
    return;
  }

  list.innerHTML = orders.map(o => {
    const st = o.status || 'active';
    const stClass = 's-' + st;
    const stLabel = st === 'issue' ? '이슈 접수됨' : st.charAt(0).toUpperCase() + st.slice(1);
    return '<div class="order-card" onclick="sbOpenOrder(\'' + o.id + '\')">' +
      '<div class="order-num">' + esc(o.orderNumber || '') + '</div>' +
      '<div class="order-addr">' + esc(o.address || 'No address') + '</div>' +
      '<div class="order-meta">' +
        '<div class="status-dot ' + stClass + '"></div>' +
        '<span>' + stLabel + '</span>' +
        (o.area ? '<span>·</span><span>' + esc(o.area) + '</span>' : '') +
        (o.workType ? '<span>·</span><span>' + esc(o.workType) + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

// Order fields, in the order a subbie standing at the door needs them:
// where → what → when → who. Empty fields are dropped rather than shown blank.
function sbDetailFields(o) {
  const row = (k, v, cls) => !v ? '' :
    '<div class="dm-row"><div class="dm-k">' + k + '</div>' +
    '<div class="dm-v' + (cls ? ' ' + cls : '') + '">' + esc(String(v)) + '</div></div>';

  const date = (v) => {
    if (!v) return '';
    const d = new Date(v);
    if (isNaN(d)) return String(v);
    return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  let html =
    row('Address',    o.address) +
    row('Area',       o.area) +
    row('Work Type',  o.workType) +
    row('SOR Code',   o.sorCode, 'mono') +
    row('Order Date', date(o.orderDate)) +
    row('Supervisor', o.supervisor) +
    row('PRN',        o.prn, 'mono') +
    row('Assigned',   o.subbies);

  html += row('Completed', date(o.completedAt));

  // The two free-text fields. These are where the office writes what actually
  // has to happen on site, so they get blocks rather than one-line rows —
  // they are usually multi-line and are the whole point of opening the order.
  if (o.detail) {
    html += '<div class="dm-block">' +
      '<div class="dm-block-t" style="color:var(--blue)"><i class="ti ti-list-details"></i>Work Detail</div>' +
      '<div class="dm-block-b">' + esc(o.detail) + '</div></div>';
  }
  if (o.comments) {
    html += '<div class="dm-block" style="background:rgba(255,149,0,.09)">' +
      '<div class="dm-block-t" style="color:var(--orange)"><i class="ti ti-message-2"></i>Comments</div>' +
      '<div class="dm-block-b">' + esc(o.comments) + '</div></div>';
  }

  if (!html) html = '<div style="font-size:13px;color:var(--text3);padding:8px 0">표시할 정보가 없습니다</div>';
  return html;
}

function sbOpenOrder(id) {
  _currentOrder = _allOrders.find(o => o.id === id);
  if (!_currentOrder) return;
  const o = _currentOrder;
  const st = o.status || 'active';

  document.getElementById('dm-num').textContent = o.orderNumber || '';
  document.getElementById('dm-title').textContent = o.address || 'No address';

  const stColors = {active:'#007AFF',completed:'#34C759',invoiced:'#FF9500',paid:'#AF52DE',
                    cancelled:'#FF3B30',issue:'#FF9500',claim:'#AF52DE',closed:'#8A8A8E'};
  const stText   = {issue:'이슈 접수됨 — 사무실 확인 중', claim:'청구 중', closed:'정산 완료'};
  document.getElementById('dm-status').innerHTML =
    '<span style="display:inline-flex;align-items:center;gap:6px;background:' + (stColors[st]||'#007AFF') + '18;color:' + (stColors[st]||'#007AFF') + ';font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px">' +
    '<div style="width:6px;height:6px;border-radius:50%;background:' + (stColors[st]||'#007AFF') + '"></div>' +
    (stText[st] || (st.charAt(0).toUpperCase() + st.slice(1))) + '</span>';

  // The old version showed area / workType / description / scope only. Three of
  // those four are not even fields on an order ('description' and 'scope' never
  // existed — the real names are 'detail' and 'comments'), so in practice the
  // sheet was blank. Render from the actual schema instead.
  document.getElementById('dm-fields').innerHTML = sbDetailFields(o);

  // Reset upload UI
  sbClearPhotos();
  // Only offer it while there is still work to finish.
  const dw = document.getElementById('dm-done-wrap');
  if (dw) dw.style.display = ['completed','claim','invoiced','paid','closed','cancelled'].includes(st) ? 'none' : '';
  document.getElementById('issue-note').value = '';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = '이슈 제출';

  // Load past issues for this order
  sbLoadIssues(id);

  document.getElementById('detail-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('open');
  _currentOrder = null;
  sbClearPhotos();
}

// ISSUE UPLOAD
// ══════════════════════════════════════════
const MAX_PHOTOS = 4;
let _photos = [];   // [{file, url}]

function sbPickPhoto() {
  if (_photos.length >= MAX_PHOTOS) return sbShowToast('사진은 최대 ' + MAX_PHOTOS + '장까지입니다');
  document.getElementById('photo-input').click();
}

async function sbPhotoChosen(input) {
  const picked = Array.from(input.files || []);
  input.value = '';
  if (!picked.length) return;
  const room = MAX_PHOTOS - _photos.length;
  if (picked.length > room) sbShowToast(room ? room + '장만 추가됩니다' : '사진은 최대 ' + MAX_PHOTOS + '장까지입니다');
  for (const f of picked.slice(0, room)) {
    const shrunk = await sbShrink(f);
    _photos.push({ file: shrunk, url: URL.createObjectURL(shrunk) });
  }
  sbRenderPhotos();
}

function sbRemovePhoto(i) {
  const p = _photos[i];
  if (p && p.url) URL.revokeObjectURL(p.url);
  _photos.splice(i, 1);
  sbRenderPhotos();
}

function sbRenderPhotos() {
  const grid = document.getElementById('photo-grid');
  if (grid) grid.innerHTML = _photos.map((p, i) =>
    '<div class="ph-cell"><img src="' + p.url + '" alt="">' +
    '<button class="ph-del" onclick="sbRemovePhoto(' + i + ')">&times;</button></div>').join('');
  const c = document.getElementById('photo-count');
  if (c) c.textContent = _photos.length ? '(' + _photos.length + '/' + MAX_PHOTOS + ')' : '';
  const b = document.getElementById('add-photo-btn');
  if (b) b.disabled = _photos.length >= MAX_PHOTOS;
}

function sbClearPhotos() {
  _photos.forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
  _photos = [];
  sbRenderPhotos();
}

// A modern phone photo is 4-6 MB. Four of those over site mobile data is a long
// wait and a failed upload as often as not. 1600px at q0.75 is still far more
// than enough to see a cracked tile or the wrong fitting.
function sbShrink(file, maxDim = 1600, quality = 0.75) {
  return new Promise(resolve => {
    if (!/^image\//.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 900000) return resolve(file);
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b ? new File([b], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg',
        { type: 'image/jpeg' }) : file), 'image/jpeg', quality);
    };
    // A HEIC or otherwise undecodable file goes up as-is rather than failing.
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function sbReportDone() {
  if (!_currentOrder) return;
  if (!confirm((_currentOrder.orderNumber || '') + '\n' + (_currentOrder.address || '') +
               '\n\n이 작업을 완료로 보고할까요?')) return;
  const btn = document.getElementById('done-btn');
  btn.disabled = true;
  btn.textContent = '전송 중…';
  try {
    const ts = Date.now();
    await _db.ref('/issueReports/' + _currentOrder.id + '_' + ts).set({
      type:        'done',
      orderId:     _currentOrder.id,
      orderNumber: _currentOrder.orderNumber || '',
      address:     _currentOrder.address || '',
      by:          _user,
      at:          ts
    });
    sbShowToast('완료 보고가 전달되었습니다 ✓');
    closeModal();
  } catch (e) {
    sbShowToast('전송 실패 — 다시 시도해주세요');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-circle-check"></i> 작업 완료 보고';
  }
}

async function sbSubmitIssue() {
  if (!_currentOrder) return;
  const note = document.getElementById('issue-note').value.trim();
  if (!_photos.length && !note) { sbShowToast('사진이나 설명을 먼저 넣어주세요'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  try {
    const ts = Date.now();
    const orderId = _currentOrder.id;

    // Upload sequentially, not in parallel: site reception is usually poor and
    // four simultaneous uploads on a weak signal fail more often than they
    // finish. Progress on the button so it does not look frozen.
    const urls = [];
    for (let i = 0; i < _photos.length; i++) {
      btn.textContent = '사진 업로드 중… ' + (i + 1) + '/' + _photos.length;
      const f = _photos[i].file;
      const ref = _storage.ref('issues/' + orderId + '/' + ts + '_' + i + '.jpg');
      await ref.put(f);
      urls.push(await ref.getDownloadURL());
    }

    btn.textContent = '제출 중…';
    await _db.ref('/issues/' + orderId + '/' + ts).set({
      note:      note || '',
      photoUrl:  urls[0] || '',        // kept for older readers
      photoUrls: urls,
      createdAt: ts,
      createdBy: _user
    });

    // The part that was missing. Writing to /issues alone meant the office
    // never learned about it — nothing watches that node and the order stayed
    // 'active'. This queues a report the office apps pick up and turn into a
    // real Issue on the order.
    await _db.ref('/issueReports/' + orderId + '_' + ts).set({
      orderId:     orderId,
      orderNumber: _currentOrder.orderNumber || '',
      address:     _currentOrder.address || '',
      note:        note || '',
      photoUrls:   urls,
      photoCount:  urls.length,
      by:          _user,
      at:          ts
    });

    sbShowToast('이슈가 사무실로 전달되었습니다 ✓');
    document.getElementById('issue-note').value = '';
    sbClearPhotos();
    sbLoadIssues(orderId);

  } catch (err) {
    console.error('[Issue] Upload error:', err);
    sbShowToast('업로드 실패 — 다시 시도해주세요');
  } finally {
    btn.disabled = false;
    btn.textContent = '이슈 제출';
  }
}

function sbLoadIssues(orderId) {
  if (!_db) return;
  const container = document.getElementById('past-issues');
  _db.ref('/issues/' + orderId).once('value', snap => {
    const data = snap.val() || {};
    const items = Object.entries(data).sort((a,b) => Number(b[0])-Number(a[0]));
    if (!items.length) { container.innerHTML = ''; return; }
    container.innerHTML =
      '<div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;margin-top:12px">Previous Issues (' + items.length + ')</div>' +
      items.map(([ts, issue]) =>
        '<div class="issue-item">' +
          '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">' +
            new Date(Number(ts)).toLocaleDateString('en-AU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) +
            ' · ' + esc(issue.createdBy || '') +
          '</div>' +
          (issue.note ? '<div style="color:var(--text1);margin-bottom:4px">' + esc(issue.note) + '</div>' : '') +
          ((issue.photoUrls && issue.photoUrls.length ? issue.photoUrls : (issue.photoUrl ? [issue.photoUrl] : []))
            .map(u => '<img src="' + u + '" alt="issue photo" onclick="window.open(this.src)" style="width:100%;border-radius:8px;cursor:zoom-in;margin-top:6px">').join('')) +
        '</div>'
      ).join('');
  });
}

// ══════════════════════════════════════════
// SETTINGS SHEET
// ══════════════════════════════════════════
// A subbie needs far less than the office does. The only real question they
// have is "will my phone actually ring when a job comes in?" — so the sheet is
// built around answering that, plus who am I signed in as.
//
// Deliberately NOT here: sync-address (subbies read RTDB directly, they never
// touch Apps Script), push registry (admin-only, and the rules deny it), and
// the device lock (subbie.html has no PIN/Face ID).

function sbOpenSettings() {
  sbRenderSettings();
  document.getElementById('set-overlay').classList.add('open');
}
function sbCloseSettings() {
  document.getElementById('set-overlay').classList.remove('open');
}

function _sbPushState() {
  if (typeof Notification === 'undefined' || !('serviceWorker' in navigator))
    return { key: 'unsupported', label: '지원 안 함',  color: 'var(--text3)' };
  if (Notification.permission === 'granted')
    return { key: 'on',          label: 'ON',        color: 'var(--green)' };
  if (Notification.permission === 'denied')
    return { key: 'blocked',     label: '차단됨',     color: 'var(--red)' };
  return   { key: 'off',         label: 'OFF',       color: 'var(--text3)' };
}

// iOS only delivers web push to a Home Screen app installed from Safari.
// A Chrome/Firefox/Edge shortcut looks identical to the user but can never
// receive a background notification, so it is worth saying out loud.
function _sbIosPushBlocker() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  if (!isIOS) return null;
  if (/CriOS|FxiOS|EdgiOS/.test(ua)) return '크롬·파이어폭스로 만든 바로가기는 알림을 받을 수 없습니다. 사파리로 다시 홈 화면에 추가해주세요.';
  const standalone = window.navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;
  if (!standalone) return '아이폰은 홈 화면에 추가해야 앱이 닫혀 있을 때도 알림이 옵니다. 사파리 공유 → 홈 화면에 추가.';
  return null;
}

function sbRenderSettings() {
  const push  = _sbPushState();
  const email = (_sbAuth && _sbAuth.currentUser && _sbAuth.currentUser.email) || '—';
  const warn  = _sbIosPushBlocker();
  const online = !!(_db && _ordersListener);

  const row = (ico, bg, col, title, desc, right, onclick) =>
    '<div class="set-row' + (onclick ? '' : ' static') + '"' +
      (onclick ? ' onclick="' + onclick + '"' : '') + '>' +
      '<div class="set-ico" style="background:' + bg + ';color:' + col + '"><i class="ti ti-' + ico + '"></i></div>' +
      '<div class="set-txt"><div class="set-t">' + title + '</div>' +
        (desc ? '<div class="set-d">' + desc + '</div>' : '') + '</div>' +
      (right || '') +
      (onclick ? '<i class="ti ti-chevron-right set-chev"></i>' : '') +
    '</div>';

  document.getElementById('set-body').innerHTML =
    // ── 알림 ──
    '<div class="set-group">' +
      '<div class="set-label">알림</div>' +
      '<div class="set-card">' +
        row('bell', 'rgba(255,149,0,.14)', 'var(--orange)',
            '알림 (Push)',
            push.key === 'blocked' ? '브라우저 설정에서 다시 허용해야 합니다'
          : push.key === 'on'      ? '새 오더가 배정되면 알림이 옵니다'
          : '켜면 새 오더를 바로 받습니다',
            '<span class="set-val" style="color:' + push.color + '">' + push.label + '</span>',
            push.key === 'off' ? 'sbSettingsEnablePush()' : null) +
        row('bell-ringing', 'rgba(0,122,255,.14)', 'var(--blue)',
            '테스트 알림', '지금 이 기기에 알림을 하나 보냅니다',
            '', 'sbTestNotification()') +
        row('stethoscope', 'rgba(88,86,214,.14)', 'var(--purple)',
            '알림 진단', '왜 알림이 안 오는지 확인합니다',
            '', 'sbNotifDiagnostics()') +
      '</div>' +
      (warn ? '<div style="font-size:12px;color:var(--orange);padding:8px 6px 0;line-height:1.5">' +
                '<i class="ti ti-alert-triangle"></i> ' + esc(warn) + '</div>' : '') +
    '</div>' +

    // ── 연결 ──
    '<div class="set-group">' +
      '<div class="set-label">연결</div>' +
      '<div class="set-card">' +
        row('cloud-check', 'rgba(52,199,89,.14)', 'var(--green)',
            '오더 동기화', online ? '실시간으로 연결되어 있습니다' : '연결을 확인하는 중입니다',
            '<span class="set-val" style="color:' + (online ? 'var(--green)' : 'var(--text3)') + '">' +
              (online ? '실시간' : '대기') + '</span>', null) +
        row('refresh-alert', 'rgba(0,122,255,.14)', 'var(--blue)',
            '강제 새로고침', '최신 버전을 다시 받아옵니다',
            '', 'hardReload()') +
      '</div>' +
    '</div>' +

    // ── 계정 ──
    '<div class="set-group">' +
      '<div class="set-label">계정</div>' +
      '<div class="set-card">' +
        row('user-check', 'rgba(88,86,214,.14)', 'var(--purple)',
            esc(_user || '—'), esc(email), '', null) +
        row('logout', 'rgba(255,59,48,.14)', 'var(--red)',
            '로그아웃', '', '', 'sbLogout()') +
      '</div>' +
      '<div style="text-align:center;font-size:11px;color:var(--text3);padding:14px 0 0">빌드 ' + APP_BUILD + '</div>' +
    '</div>';
}

async function sbSettingsEnablePush() {
  const p = await Notification.requestPermission();
  if (p === 'granted') { await sbFcmRegister(); sbShowToast('알림이 켜졌습니다'); }
  else sbShowToast('알림이 허용되지 않았습니다');
  sbRenderSettings();
}

// Goes through the service worker rather than `new Notification()` — that is
// the same path a real push takes, so a pass here means the whole chain works,
// not just that the permission flag is set.
async function sbTestNotification() {
  if (typeof Notification === 'undefined') return sbShowToast('이 기기는 알림을 지원하지 않습니다');
  if (Notification.permission !== 'granted') return sbShowToast('먼저 알림을 켜주세요');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) {
      await reg.showNotification('테스트 알림', {
        body: '알림이 정상적으로 작동합니다 ✓',
        icon: 'icon-192.png', badge: 'icon-192.png', tag: 'sb-test'
      });
    } else {
      new Notification('테스트 알림', { body: '알림이 정상적으로 작동합니다 ✓' });
    }
    sbShowToast('알림을 보냈습니다');
  } catch (e) {
    sbShowToast('알림 발송 실패: ' + (e.message || e));
  }
}

async function sbNotifDiagnostics() {
  const L = [];
  const ok = (t) => L.push('✅ ' + t);
  const no = (t) => L.push('❌ ' + t);
  const wa = (t) => L.push('⚠️ ' + t);

  typeof Notification !== 'undefined' ? ok('브라우저 알림 지원') : no('브라우저 알림 미지원');
  'serviceWorker' in navigator     ? ok('서비스 워커 지원')   : no('서비스 워커 미지원');

  const perm = typeof Notification !== 'undefined' ? Notification.permission : 'unsupported';
  perm === 'granted' ? ok('알림 권한 허용됨')
    : perm === 'denied' ? no('알림 권한 차단됨 — 브라우저 설정에서 허용 필요')
    : wa('알림 권한 미설정 — 설정에서 켜주세요');

  try {
    const reg = await navigator.serviceWorker.getRegistration();
    reg ? ok('서비스 워커 등록됨') : no('서비스 워커 미등록');
  } catch (e) { no('서비스 워커 확인 실패'); }

  // The single most common cause of "it works in the app but not when closed".
  const blocker = _sbIosPushBlocker();
  if (blocker) wa(blocker); else ok('기기 설치 상태 정상');

  // Token must be filed under the name the server looks up, or the Cloud
  // Function finds nothing and returns silently — no error anywhere.
  if (_user && _db) {
    try {
      const key  = _user.replace(/\s+/g, '_');
      const snap = await _db.ref('/fcmTokens/' + key).get();
      const n = snap.exists() ? Object.keys(snap.val()).length : 0;
      n > 0 ? ok('푸시 등록됨 (' + key + ' · 기기 ' + n + '대)')
            : no('푸시 미등록 (' + key + ') — 알림을 껐다 켜주세요');
    } catch (e) {
      wa('등록 확인 불가 — 권한 문제일 수 있습니다');
    }
  }

  _db && _ordersListener ? ok('오더 실시간 연결됨') : wa('오더 연결 확인 필요');

  // The most common "my app is empty" cause, made visible.
  // _mirrorSize: 0 = nothing sent yet, -1 = data exists but none matched me.
  if (_mirrorSize === 0) no('사무실에서 내려보낸 오더 데이터가 없습니다 — 관리자에게 문의하세요');
  else if (!_allOrders.length) no('오더 데이터는 있으나 "' + (_user || '') + '" 이름과 맞는 것이 없습니다\n   → 사무실에 등록된 이름 철자를 확인해주세요');
  else ok('내 오더 ' + _allOrders.length + '건');

  alert('알림 진단\n\n' + L.join('\n') +
        '\n\n계정: ' + (_user || '—') + '\n빌드: ' + APP_BUILD);
}

// ══════════════════════════════════════════
// FCM PUSH NOTIFICATIONS
// ══════════════════════════════════════════
function sbFcmSetup() {
  if (!('serviceWorker' in navigator)) return;
  if (typeof Notification === 'undefined') return;

  if (Notification.permission === 'granted') {
    sbFcmRegister();
    return;
  }
  if (Notification.permission !== 'denied') {
    // Show enable bar after a short delay
    setTimeout(() => {
      document.getElementById('fcm-bar').style.display = 'flex';
    }, 1500);
  }
}

async function sbFcmEnable() {
  document.getElementById('fcm-bar').style.display = 'none';
  const permission = await Notification.requestPermission();
  if (permission === 'granted') sbFcmRegister();
}

async function sbFcmRegister() {
  try {
    if (!firebase || !_user) return;
    if (!_messaging) _messaging = firebase.messaging(_app);

    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const token = await _messaging.getToken({ vapidKey: _FCM_VAPID, serviceWorkerRegistration: reg });
    if (!token) return;

    // Stable device ID
    let deviceId = localStorage.getItem('fcm_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).slice(2, 12);
      localStorage.setItem('fcm_device_id', deviceId);
    }

    // Normalise name for RTDB key ("Jake Lee" → "Jake_Lee")
    const fcmKey = _user.replace(/\s+/g, '_');
    await _db.ref('/fcmTokens/' + fcmKey + '/' + deviceId).set(token);
    console.log('[FCM] Registered as', fcmKey);

    // Foreground messages
    _messaging.onMessage(payload => {
      const title = payload.notification?.title || 'New Order';
      const body  = payload.notification?.body  || '';
      sbShowFcmBanner(title, body);
    });

  } catch (err) {
    console.error('[FCM] Error:', err);
  }
}

function sbShowFcmBanner(title, body) {
  const el = document.getElementById('fcm-notif-banner');
  el.innerHTML =
    '<div style="width:32px;height:32px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
      '<i class="ti ti-bell-ringing" style="font-size:16px;color:#fff"></i>' +
    '</div>' +
    '<div style="flex:1;min-width:0;margin-left:10px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:2px">' + esc(title) + '</div>' +
      '<div style="font-size:12px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(body) + '</div>' +
    '</div>' +
    '<button onclick="this.parentElement.style.display=\'none\'" style="background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:0 0 0 10px">&times;</button>';
  el.style.display = 'flex';
  setTimeout(() => { el.style.display = 'none'; }, 6000);
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer;
function sbShowToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modal on overlay tap
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Kick off
document.addEventListener('DOMContentLoaded', sbInit);
</script>
